    title: "青山のギャラリー、霧に包まれる森",
    paragraphs: [
      "翌朝、目を覚ましてまず確認したのは、やはりあの画面だった。既読のまま、何も変わっていない。僕はその事実に、安堵とも失望ともつかない宙ぶらりんの感情を抱えたまま、一日を過ごし始めた。仕事は以前にも増して手につかなかった。クライアントからのメールに目を通しても、文字が意味を結ばないまま視線だけが行を滑り落ちていく。僕はペンタブレットを握る手を何度も止め、窓の外を見た。空はいつもと変わらぬ曇り空で、遠くのビルの輪郭が霞んだ大気の中にぼんやりと溶け込んでいた。その景色を眺めながら、僕はふと、あの霧の風景のアイコンを思い出した。輪郭を失いつつあったあの森の画像。既読がついたということは、少なくとも彼のアカウントはまだこの世界のどこかに残されているということだ。しかしそれ以上の手がかりは何もなかった。",
      "そんなある日、僕はデザイン事務所での作業の合間に、青山のギャラリーで開催されている写真展の案内をたまたま目にした。クライアントの一人がそのギャラリーのウェブサイトのリニューアルを依頼していた関係で、僕はそのDMを資料として受け取っていたのだった。「風景の不在」という展示タイトルと、モノクロームの霧に覆われた森の写真が案内状の表紙を飾っていた。僕はその写真を一目見た瞬間、胸の奥に鈍い痛みにも似た奇妙な既視感を覚えた。それは響己のメッセージアプリのアイコン画像とどこか似た質感を持つ写真だった。僕は特に深く考えることもなく、その案内状を鞄の中に入れた。ただその日一日、僕の頭の片隅には、その霧の写真の残像がずっとちらついていた。仕事を終え帰路につく途中、僕はふとその足を駅とは反対の方向へと向けていた。理由らしい理由はなかった。ただ身体が勝手にそちらへと吸い寄せられていったのだ。",
      "気づけば、僕は青山通り沿いのあのギャラリーの入るビルの前に立っていた。白い外壁のビルは周囲の喧騒から静かに切り離された空気を纏っている。僕はしばらくその入り口を見上げたまま立ち尽くしていた。中に入るべきかどうか迷いがあった。しかしあの案内状の霧の写真が頭の中からどうしても離れなかった。僕は結局その白い階段をゆっくりと上り、ギャラリーの中へと足を踏み入れた。",
      "ギャラリーの内部は想像していたよりも広く、天井が高かった。白い壁面に大判の写真作品が一定の間隔を空けて並んでいる。企画展のタイトルは『風景の不在』。写真家は一貫して人の気配が完全に消え去った場所ばかりを撮影しているようだった。誰もいない駅のホーム。灯りの落ちたオフィスビルの内部。廃墟になったまま放置された地方の遊園地。どの写真にも共通して、生活の痕跡だけが生々しく残されていた。壁に貼られたままの色褪せたポスター。床に転がった一足だけの子供靴。誰かが最後まで使っていたであろう埃をかぶったデスクの上のマグカップ。僕はその写真の一枚一枚を、時間をかけて丁寧に見て回った。人の姿はどこにも写っていない。しかしそこには確かに人が生きていた痕跡が色濃く残されている。その矛盾した情報──不在でありながら存在の証拠に満ちている──という状態こそが、この展示の核心なのだろうと僕は理解した。そしてその理解と共に、ある考えが僕の中に静かに浮かび上がってきた。",
      "あの世田谷の部屋には、それがなかったのだ。あの部屋には不在すらなかった。不在という状態が成立するためには、少なくともかつてそこに何かが在った、という前提が必要になる。しかし響己の部屋には、その前提そのものが存在しなかった。塵一つない床。皺一つないシーツ。空っぽのサニタリーボックス。それらは単に今、誰もいないという不在の状態を示しているのではない。むしろその空間そのものが生活というものを最初から一度も経験したことがないということを雄弁に物語っていた。ここに写っている、誰もいなくなった廃墟の遊園地の方がよほど生々しい。少なくともこの写真の中の遊園地には、かつて無数の子供たちの笑い声が確かに響き渡っていたはずなのだから。僕はその考えに囚われたまま展示室の奥へと進んでいった。一番奥の壁にはひときわ大きなサイズの写真が一枚だけ掛けられていた。それは深い霧に包まれた針葉樹の森を写した写真だった。僕はその写真の前で思わず足を止めた。心臓が大きく跳ね上がる。それは響己のメッセージアプリのアイコン画像と驚くほどよく似た構図だった。もちろんまったく同じ写真であるはずはない。しかしその霧の質感、木々の輪郭の曖昧さ、光の届かない奥行きの深さ。それらすべてが、あの僕が何度も拡大して見つめてきた、あの小さな画像の記憶と鋭く重なり合った。僕はキャプションのプレートに視線を落とした。",
      "作品タイトルは『不在の証明』。撮影場所は記載されておらず、ただ撮影者の言葉として、短い一文だけが添えられていた。",
      "「霧の中では、そこに何があるのかを決して確かめることができない。しかし霧そのものは、確かにそこに在る」",
      "僕はしばらくの間、その写真の前に立ち尽くしていた。他の来場者が時折、僕の背後を通り過ぎていく気配があった。彼らの足音、囁くような話し声、パンフレットをめくる紙の音。それらの些細な生活音が、この静謐な展示室に確かな人間の温度を与えていた。僕はその温度に無意識のうちに縋りついていた。しかしそのときだった。僕の視界の端、展示室の入り口の方向に見覚えのある人影がふと映り込んだ。僕は反射的にその方向へと視線を向けた。心臓が一瞬にして凍りついたように、その動きを止めた。入り口の受付カウンターの前に、一人の男が立っていた。生成り色のコート。あの日、表参道の路地裏で見た、あの服装だった。響己だった。",
      "彼は受付のスタッフと何か言葉を交わしていた。その姿は以前と何ら変わらない、あの完璧な静謐さを湛えていた。しかし僕がその場に立ち尽くしたまま身動きが取れずにいるうちに、彼は受付スタッフに軽く会釈をすると、そのまま展示室の中へと足を踏り入れてきた。僕は咄嗟に近くにあった別の写真作品の陰に、身を隠すようにして身体を移動させた。心臓が痛いほどに速く脈打っている。息を潜めながら、僕は作品の額縁の端から、そっと彼の様子を窺った。響己は展示室の中央あたりで足を止めていた。彼は僕がいる場所からは少し離れた位置にある、別の写真──誰もいない小学校の教室を写した写真──の前に立ち、その作品を静かに見つめていた。僕はその横顔に感情の揺らぎのようなものを見出そうとした。しかし今、僕の目の前にいる響己の表情には、感情の揺らぎを見せるような表情の機微は見当たらなかった。彼はいつも通りの完璧な、凪いだような静けさを湛えたまま、写真をじっと見つめているだけだった。僕はその事実に奇妙な安堵と、同時に深い落胆を覚えた。やはり彼は本当に死んでいるのだろうか。",
      "僕はしばらくの間、その場に隠れたまま彼の様子を観察し続けた。彼は一枚一枚の写真をゆっくりとした足取りで丁寧に見て回っていた。その所作の一つひとつは、やはりこれまでと変わらず一切の無駄がなかった。歩く速度、立ち止まる位置、視線の動かし方。そのすべてが、まるであらかじめ用意された完璧な鑑賞のシークエンスを忠実になぞっているかのようだった。やがて彼は展示室の奥へと進み、僕がさきほどまで見つめていた、あの霧の森の写真の前にたどり着いた。僕は息を止めた。響己はその写真の前で長い間、立ち止まっていた。他のどの作品よりも明らかに長い時間を、彼はその一枚の前で過ごしていた。彼の視線は写真の中の深い霧の奥へと吸い込まれるように向けられていた。僕はその様子を隠れた場所からじっと見つめ続けていた。そして僕は再び気づいた。響己の横顔に、あの表情が、ゆっくりと浮かび上がってきていたのだ。それはあの夕暮れの路地裏で見たものと、まったく同じ質の翳りだった。眉間に刻まれるあの浅い、しかし確かな緊張の線。内側へと微かに引き結ばれる唇。そしてあの宇宙的な孤独を湛えた瞳。僕はその光景を、瞬きすることさえ忘れて見つめ続けた。あの表情は幻覚ではなかった。少なくとも僕一人だけが見ている、僕の脳が作り出した妄想の産物ではなかった。今この瞬間、確かに僕の目の前に、あの表情が再び現れているのだ。",
      "僕は隠れていた場所から思い切って一歩踏み出した。額縁の陰から身体を完全に露わにする。もし彼がこちらを振り返れば、僕がここにいたということは、すぐに知られてしまうだろう。しかし僕はもう隠れ続けることができなかった。あの表情の意味をもう一度確かめたいという衝動が、僕のあらゆる躊躇を押し流していった。僕は彼に向かって、ゆっくりと歩み寄っていった。展示室の床は静かな空間の反響を強調するかのように、僕の足音を思いのほか大きく響かせた。しかし響己は僕の接近に、まったく気づいていないかのように、あの霧の森の写真を見つめ続けていた。僕は彼の背後、二メートルほどの距離まで近づいた。そこで僕ははっきりと、その言葉を聞いた。響己が誰にともなく、ごく小さな声で呟いたのだ。",
      "「……ここに、いたのか」",
      "その声は、僕がこれまで聞いてきた、あの完璧な抑揚の整った声とは明らかに質が異なっていた。もっと低く、もっと掠れた、そしてもっと──弱々しい声だった。まるで長い間、誰にも話しかけられることのなかった人間が、久しぶりに声を発するときのような、そういう乾いた頼りない響き。",
      "僕は思わず、その場に立ち尽くした。彼の呟きの意味を僕はうまく理解することができなかった。誰に対して彼はそう言ったのだろう。写真の中の誰もいない静謐な森に対してだろうか。それとも写真そのものに写った、あのどこか危うい霧に対してだろうか。あるいは彼自身の内側にある、誰にも語られることのない何かに対してだったのだろうか。",
      "「響己さん」",
      "僕は震える声で彼に呼びかけた。その瞬間、響己の肩が微かに、しかしはっきりと跳ねた。それはこれまで一度も見たことのない、彼の反応だった。彼はゆっくりと僕の方へと身体を向けた。その動作にはこれまでの彼のあらゆる動作とは異なる、ある種の緩慢さとためらいのようなものが確かに含まれていた。",
      "振り返った彼の顔には、しかし僕が期待していたような底知れない孤独の表情は、もはや残されていなかった。そこにあったのはいつものあの完璧な微笑みだった。ただその微笑みが浮かび上がるまでのコンマ数秒の間、僕は確かに、彼の顔の上を、何か別のもの──僕がこれまで一度も見たことのない生々しい驚愕の色──が、素早く通り過ぎていくのを見た気がした。",
      "「拓真さん」",
      "彼はいつもの、あの完璧な声のトーンで僕の名前を呼んだ。しかしその声には、まだ微かな震えのようなものが僅かに残っていた。",
      "「まさか、こんなところでお会いできるとは」",
      "「僕も、驚きました。……響己さんも、写真展を見に来られていたんですね」",
      "マンションの部屋の不在についてはなるべく触れず、僕は努めて平静を装った。",
      "「ええ。この写真家の作品を以前から気に入っていまして。展示会があると聞いて、来てみました」",
      "響己はそう答えながら、僕の後方に視線を移した。僕がさきほどまで見つめていた、霧の森の写真を彼はもう一度、確かめるように見つめた。",
      "「拓真さんも、この写真を見ていたんですか」",
      "「はい。何だか、以前にどこかで見た景色のような気がして、目が離せなくなってしまって」",
      "僕はそう答えながら彼の反応を注意深く観察していた。しかし響己の表情には、もはや何の変化も見られなかった。",
      "「不思議なものですね」",
      "彼はそう言って、写真に向き直った。",
      "「同じ写真を見ていても、人によってそこに何を見出すかはまったく違う。私はこの霧の中に、ある種の──安らぎのようなものを、感じるんです」",
      "「安らぎ、ですか」",
      "「ええ。すべてが境界を失い、溶け合っていく。何が何であるかという判別そのものが意味を失っていく。そういう状態がどうも落ち着くんです」",
      "その言葉を聞いた瞬間、僕の背筋を冷たいものが静かに、しかし確実に這い上がってきた。",
      "「……響己さんは、はっきりとした輪郭を持つことが苦手なんですか」",
      "僕は思い切って、その質問を口にした。自分でも何故、そんな質問をしたのか正確には分からなかった。ただこの霧の写真を見つめる響己の横顔から、そういう問いが自然と口をついて出てきたのだ。響己は僕の質問に一瞬、動きを止めた。それはこれまでの彼の反応の中でも、最も長い沈黙の間だった。窓から差し込む午後の光が彼の輪郭を静かに、しかし確かに縁取っていた。",
      "「……面白いことを、聞きますね」",
      "やがて彼はそう答えた。その声には、これまでにない微かな笑いの気配が混じっていた。",
      "「輪郭というものは誰かがそこに線を引くことによって初めて生まれるものだと、私は思っています。線を引く人間がいなければ、そこにはただ無限に続く連続した何かがあるだけです。ちなみに拓真さんは私という存在の輪郭を、どこに引いているんですか？」",
      "その問いに、僕は答えることができなかった。",
      "「僕は……」",
      "言葉に詰まった。",
      "「僕はあなたを完璧な人だと思っています。汚れのない、綻びのない、理想の存在だと。でも──」",
      "僕は一度、言葉を切った。あの夕暮れの路地裏で見た、あの表情のことを僕はどうしても口にせずにはいられなかった。",
      "「でも三ヶ月前、僕は表参道の路地裏で、あなたを見かけたんです。夕暮れ時の路地の中で、あなたは誰かに見られているとは思っていなかったのだと思います。そのとき、あなたの顔には──ものすごく深い孤独のようなものが浮かんでいました」",
      "響己は僕の言葉をじっと聞いていた。彼の表情には驚きも動揺も浮かんでいなかった。ただあの凍りついた湖面のような深い静けさが、そこにあった。しかしその静けさの奥に、僕はこれまでとは違う何か──言葉にならない微かな揺らぎのようなものを感じ取った。",
      "「……あなたを追いかけました。でも、見失ってしまいました。あの夜以来、僕はずっとあの表情の意味を考え続けています」",
      "「そうでしたか」",
      "響己は静かに頷いた。",
      "「では拓真さんはその答えを私に直接、尋ねに来たんですね」",
      "「はい」",
      "「でも、それは偶然です。私は貴方が今日、ここに来ることを知らなかった」",
      "「ええ。本当にただの偶然です。でも──」",
      "僕は彼の目を真っ直ぐに見つめた。",
      "「教えてください。あなたはあのとき、何を考えていたんですか」",
      "響己はしばらくの間、僕の視線を受け止めていた。展示室には他にも数人の来場者がいたが、僕たちの周囲にはその瞬間、誰も近づいてこなかった。まるで僕たちの会話が作り出す、目に見えない緊張の膜が、周囲の人々を無意識のうちに遠ざけているかのようだった。",
      "「拓真さん」",
      "やがて響己は静かに口を開いた。",
      "「私はあなたに一つ、聞きたいことがあります」",
      "「何ですか」",
      "「あなたはこの写真──この霧に包まれた森の写真を、どうして見つめていたんですか」",
      "僕はその質問の意図をすぐには理解できなかった。",
      "「それは……あなたのアイコン画像に似ていたからです。あの霧のかかった森の写真。あなたのアイコンも最近、少しずつ輪郭が曖昧になっていって、まるでこの写真のように、すべてが霧に溶け込んでいくような、そういう印象を受けていました」",
      "「そうですか」",
      "響己は静かに目を伏せた。",
      "「実は、あの私のアイコン画像は──この写真家の別の作品なんです。同じシリーズの中の一枚」",
      "「え……」",
      "「私はこの写真家の作品が好きなんです。特にこの霧をテーマにした一連のシリーズが。誰もいない場所を撮っているようで、実はそこには常に何かが確かに存在している。ただそれが霧によって隠されているだけなんです。私はそこに、ある種の──親近感のようなものを感じています」",
      "その言葉を聞いた瞬間、僕の中でこれまでの疑念の断片が、一つの新しい輪郭を結び始めていた。もし彼のアイコン画像が単なる、彼自身が選んだ一枚の写真作品に過ぎないのだとしたら。僕がこれまでその画像の変化に見出してきた、あらゆる不気味な意味──彼という存在が少しずつこの世界から消えていくという、あの恐怖の物語──は、いったいどこまでが僕自身の妄想だったのだろうか。",
      "しかしそれでも僕の中には、まだ消えることのない疑念が確かに残っていた。",
      "「……でも、なぜ、この写真を選んだんですか。誰もいない、輪郭の曖昧な、霧の風景を」",
      "響己はその質問に、ゆっくりと答えを紡ぎ始めた。",
      "「拓真さん。あなたはこの写真家の言葉を読みましたか。あのキャプションに書かれていた言葉を」",
      "「はい。読みました」",
      "「『霧の中では、そこに何があるのかを決して確かめることができない。しかし霧そのものは、確かにそこに在る』」",
      "響己はその一文を諳んじるように、正確に口にした。",
      "「私はこの言葉を初めて読んだとき、まるで自分自身のことを言い当てられているような気がしました」",
      "「自分自身のこと、ですか」",
      "「ええ」",
      "響己はその言葉を口にしながら、僕の方へと視線を戻した。その瞳の奥には、あの路地裏で見た宇宙的な孤独の色が確かに、そこに宿っていた。",
      "「拓真さん。あなたはこれまで私という存在を、完璧というフィルターを通してしか見たことがなかった。あなたが見ていたのはいつも、私を包む、霧の方だけだったんです。その霧の奥に本当に何が──あるいは誰が──存在するのか、あなたはこれまで一度も確かめなかった」",
      "僕はその言葉に息を呑んだ。それはまさに僕があの写真の前で一人、考えていたことと寸分違わず同じ内容だった。",
      "「では、あの霧の奥には、いったい何が──」",
      "僕はその問いを最後まで口にすることができなかった。響己は僕の言葉を静かに遮った。",
      "「拓真さん。今、この場所で、そのすべてをお話しすることはできません」",
      "「どうして、ですか」",
      "「ここはあまりにも多くの人の目がある場所です。そして私自身、まだあなたに何を、どこまで話すべきなのか、自分の中で整理がついていないんです」",

const FS_DOC_URL =

function fromFirestoreValue(v) {
  if (v == null) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("nullValue" in v) return null;
  if ("timestampValue" in v) return v.timestampValue;
  if ("arrayValue" in v) {
    const vals = (v.arrayValue && v.arrayValue.values) || [];
    return vals.map(fromFirestoreValue);
  }
  if ("mapValue" in v) {
    const fields = (v.mapValue && v.mapValue.fields) || {};
    const out = {};
    Object.keys(fields).forEach(function (k) {
      out[k] = fromFirestoreValue(fields[k]);
    });
    return out;
  }
  return null;
}

function firestoreDocToObject(doc) {
  if (!doc || !doc.fields) return null;
  const out = {};
  Object.keys(doc.fields).forEach(function (k) {
    out[k] = fromFirestoreValue(doc.fields[k]);
  });
  return out;
}

function toFirestoreValue(val) {
  if (val === null || val === undefined) return { nullValue: null };
  if (typeof val === "string") return { stringValue: val };
  if (typeof val === "boolean") return { booleanValue: val };
  if (typeof val === "number") {
    if (Number.isInteger(val)) return { integerValue: String(val) };
    return { doubleValue: val };
  }
  if (Array.isArray(val)) {
    return { arrayValue: { values: val.map(toFirestoreValue) } };
  }
  if (typeof val === "object") {
    const fields = {};
    Object.keys(val).forEach(function (k) {
      if (val[k] !== undefined) fields[k] = toFirestoreValue(val[k]);
    });
    return { mapValue: { fields: fields } };
  }
  return { stringValue: String(val) };
}

function objectToFirestoreDoc(obj) {
  const fields = {};
  Object.keys(obj).forEach(function (k) {
    if (obj[k] !== undefined) fields[k] = toFirestoreValue(obj[k]);
  });
  return { fields: fields };
}

async function loadNovelViaRest() {
  const url = FS_DOC_URL + "?key=" + encodeURIComponent(firebaseConfig.apiKey);
  const res = await fetch(url);
  if (res.status === 404) return null;
  if (!res.ok) {
    const text = await res.text();
    throw new Error("REST read " + res.status + ": " + text.slice(0, 200));
  }
  const doc = await res.json();
  return firestoreDocToObject(doc);
}

async function saveNovelViaRest(payload, idToken) {
  const body = objectToFirestoreDoc(payload);
  const headers = { "Content-Type": "application/json" };
  if (idToken) headers["Authorization"] = "Bearer " + idToken;
  const res = await fetch(FS_DOC_URL + "?key=" + encodeURIComponent(firebaseConfig.apiKey), {
    method: "PATCH",
    headers: headers,
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error("REST write " + res.status + ": " + text.slice(0, 300));
  }
  return res.json();
}

function EditableText({ value, onChange, multiline, style, className, as }) {
  const { editing } = useContext(NovelContext);
  const Tag = as || (multiline ? "textarea" : "input");
  if (!editing) {
    if (multiline) {
      return React.createElement(
        "div",
        { className, style },
        typeof value === "string"
          ? value.split("\n").map((line, i) =>
              React.createElement("p", { key: i, style: { marginBottom: i < value.split("\n").length - 1 ? "1.4em" : 0 } }, line)
            )
          : value
      );
    }
    return React.createElement("span", { className, style }, value);
  }
  const baseStyle = {
    font: "inherit",
    color: "inherit",
    letterSpacing: "inherit",
    lineHeight: "inherit",
    background: "hsl(var(--accent) / 0.06)",
    border: "1px dashed hsl(var(--accent) / 0.35)",
    borderRadius: "2px",
    padding: multiline ? "0.5rem" : "0.15rem 0.35rem",
    width: "100%",
    boxSizing: "border-box",
    resize: multiline ? "vertical" : "none",
    outline: "none",
    ...style
  };
  if (multiline) {
    return React.createElement("textarea", {
      value: value || "",
      onChange: (e) => onChange(e.target.value),
      style: { ...baseStyle, minHeight: "6rem" },
      className,
      rows: Math.max(4, (value || "").split("\n").length + 1)
    });
  }
  return React.createElement("input", {
    type: "text",
    value: value || "",
    onChange: (e) => onChange(e.target.value),
    style: baseStyle,
    className
  });
}

function Read({ route }) {
  const { chapters, updateChapterTitle, updateParagraph, editing } = useContext(NovelContext);
  const match = route.match(/^\/read\/(\d+)$/);
  const num = match ? match[1] : null;
  const chapter = useMemo(
    () => chapters.find((c) => c.num === Number(num)),
    [chapters, num]
  );
  const [fontIndex, setFontIndex] = useState(() => {
    const s = Number(localStorage.getItem("novel:fontIndex"));
    return Number.isFinite(s) ? Math.min(SIZES.length - 1, Math.max(0, s)) : 1;
  });
  const [dark, setDark] = useState(() => localStorage.getItem("novel:dark") === "1");
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    localStorage.setItem("novel:fontIndex", String(fontIndex));
  }, [fontIndex]);
  useEffect(() => {
    localStorage.setItem("novel:dark", dark ? "1" : "0");
  }, [dark]);
  useEffect(() => {
    const r = document.documentElement;
    if (dark) r.classList.add("dark");
    else r.classList.remove("dark");
    return () => r.classList.remove("dark");
  }, [dark]);
  useEffect(() => {
    window.scrollTo({ top: 0, behavior: "auto" });
    setProgress(0);
  }, [num]);
  useEffect(() => {
    const onScroll = () => {
      const doc = document.documentElement;
      const max = doc.scrollHeight - doc.clientHeight;
      setProgress(max > 0 ? Math.min(1, Math.max(0, doc.scrollTop / max)) : 0);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, [num]);

  if (!chapter) {
    return React.createElement(
      "main",
      {
        style: {
          minHeight: "100vh",
          background: "var(--offwhite)",
          color: "var(--charcoal)",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          padding: "0 1.5rem"
        }
      },
      React.createElement(
        "div",
        { style: { textAlign: "center" } },
        React.createElement(
          "p",
          {
            className: "font-heading",
            style: { fontSize: "1.5rem", letterSpacing: "0.1em", marginBottom: "1.5rem" }
          },
          "話が見つかりません"
        ),
        React.createElement(
          "a",
          {
            href: "#/contents",
            style: {
              fontFamily: "var(--font-body)",
              fontSize: "0.875rem",
              color: "var(--charcoal)",
              opacity: 0.6
            }
          },
          "目次へ戻る"
        )
      )
    );
  }

  const fontSize = SIZES[fontIndex].value;
  const totalChapters = chapters.length;
  const prev = chapter.num > 1 ? chapter.num - 1 : null;
  const next = chapter.num < totalChapters ? chapter.num + 1 : null;
  const numStr = String(chapter.num).padStart(2, "0");
  const nextChapter = next ? chapters.find((c) => c.num === next) : null;

  return React.createElement(
    "main",
    {
      style: {
        position: "relative",
        minHeight: "100vh",
        background: "hsl(var(--background))",
        color: "hsl(var(--foreground))"
      }
    },
    React.createElement(
      "header",
      {
        style: {
          position: "sticky",
          top: 0,
          zIndex: 20,
          background: "hsl(var(--background) / 0.85)",
          backdropFilter: "blur(8px)",
          borderBottom: "1px solid hsl(var(--border) / 0.4)"
        }
      },
      React.createElement(
        "div",
        {
          style: {
            maxWidth: "42rem",
            margin: "0 auto",
            padding: "0 1.25rem",
            height: "3.5rem",
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            gap: "0.75rem"
          }
        },
        React.createElement(
          "a",
          {
            href: "#/contents",
            style: {
              display: "flex",
              alignItems: "center",
              gap: "6px",
              fontFamily: "var(--font-body)",
              fontSize: "0.75rem",
              color: "hsl(var(--muted-foreground))",
              flexShrink: 0
            }
          },
          React.createElement(Icon, {
            w: 14,
            h: 14,
            d: ["M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"]
          }),
          React.createElement("span", { className: "sm-inline" }, "目次")
        ),
        React.createElement(
          "span",
          {
            className: "font-display",
            style: {
              fontSize: "0.75rem",
              letterSpacing: "0.3em",
              color: "hsl(var(--muted-foreground))",
              overflow: "hidden",
              textOverflow: "ellipsis",
              whiteSpace: "nowrap"
            }
          },
          "夭折した天使たちへ"
        ),
        React.createElement(ReadingControls, { fontIndex, setFontIndex, dark, setDark })
      ),
      React.createElement(
        "div",
        {
          style: {
            height: "1px",
            width: "100%",
            background: "hsl(var(--border) / 0.4)"
          }
        },
        React.createElement("div", {
          style: {
            height: "100%",
            background: "var(--wine)",
            transformOrigin: "left",
            width: progress * 100 + "%",
            transition: "width 150ms ease-out"
          }
        })
      )
    ),
    React.createElement(
      "article",
      { style: { maxWidth: "42rem", margin: "0 auto", padding: "4rem 1.5rem 6rem" } },
      React.createElement(
        "div",
        { style: { textAlign: "center", marginBottom: "4rem" } },
        React.createElement(
          "p",
          {
            className: "font-display",
            style: {
              letterSpacing: "0.4em",
              textTransform: "uppercase",
              fontSize: "0.65rem",
              color: "hsl(var(--muted-foreground))",
              marginBottom: "1.25rem"
            }
          },
          "Chapter " + numStr
        ),
        React.createElement(
          "h1",
          {
            className: "font-heading",
            style: {
              fontWeight: 300,
              fontSize: "1.5rem",
              lineHeight: 1.6,
              letterSpacing: "0.08em",
              color: "hsl(var(--foreground))"
            }
          },
          React.createElement(EditableText, {
            value: chapter.title,
            onChange: (v) => updateChapterTitle(chapter.num, v),
            style: {
              background: editing ? "hsl(var(--accent) / 0.06)" : "transparent",
              border: editing ? "1px dashed hsl(var(--accent) / 0.35)" : "none",
              textAlign: "center",
              fontWeight: 300,
              letterSpacing: "0.08em",
              fontSize: "inherit",
              width: "100%",
              color: "inherit"
            }
          })
        ),
        React.createElement("div", {
          style: {
            margin: "2rem auto 0",
            height: "1px",
            width: "2.5rem",
            background: "var(--wine)"
          }
        })
      ),
      React.createElement(
        "div",
        {
          className: "novel-text",
          style: { fontSize, color: "hsl(var(--foreground) / 0.88)" }
        },
        (chapter.paragraphs || []).map((p, i) =>
          editing
            ? React.createElement("textarea", {
                key: i,
                value: p,
                onChange: (e) => updateParagraph(chapter.num, i, e.target.value),
                style: {
                  display: "block",
                  width: "100%",
                  font: "inherit",
                  fontSize: "inherit",
                  lineHeight: 1.95,
                  letterSpacing: "0.04em",
                  color: "inherit",
                  background: "hsl(var(--accent) / 0.06)",
                  border: "1px dashed hsl(var(--accent) / 0.35)",
                  borderRadius: "2px",
                  padding: "0.6rem",
                  marginBottom: "1.4em",
                  minHeight: "4rem",
                  resize: "vertical",
                  boxSizing: "border-box",
                  outline: "none"
                },
                rows: Math.max(3, Math.ceil((p || "").length / 40))
              })
            : React.createElement("p", { key: i }, p)
        )
      ),
      React.createElement(
        "div",
        { style: { marginTop: "5rem" } },
        React.createElement(
          "div",
          {
            style: {
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: "0.75rem",
              color: "hsl(var(--muted-foreground) / 0.5)"
            }
          },
          React.createElement("span", {
            style: { height: "1px", width: "2rem", background: "currentColor" }
          }),
          React.createElement(
            "span",
            {
              className: "font-display",
              style: { fontSize: "0.75rem", letterSpacing: "0.3em" }
            },
            numStr + " / " + String(totalChapters).padStart(2, "0")
          ),
          React.createElement("span", {
            style: { height: "1px", width: "2rem", background: "currentColor" }
          })
        ),
        React.createElement(
          "div",
          {
            style: {
              marginTop: "2.5rem",
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              gap: "1rem"
            }
          },
          prev
            ? React.createElement(
                "a",
                {
                  href: "#/read/" + prev,
                  style: {
                    display: "flex",
                    alignItems: "center",
                    gap: "0.5rem",
                    fontFamily: "var(--font-body)",
                    fontSize: "0.875rem",
                    color: "hsl(var(--muted-foreground))"
                  }
                },
                React.createElement(Icon, { w: 16, h: 16, d: ["m15 18-6-6 6-6"] }),
                React.createElement("span", { className: "sm-inline" }, "前話")
              )
            : React.createElement("span", { style: { width: "3rem" } }),
          React.createElement(
            "a",
            {
              href: "#/contents",
              style: {
                fontFamily: "var(--font-body)",
                fontSize: "0.75rem",
                letterSpacing: "0.2em",
                color: "hsl(var(--muted-foreground))"
              }
            },
            "目次"
          ),
          next
            ? React.createElement(
                "a",
                {
                  href: "#/read/" + next,
                  style: {
                    display: "flex",
                    alignItems: "center",
                    gap: "0.5rem",
                    fontFamily: "var(--font-body)",
                    fontSize: "0.875rem",
                    color: "hsl(var(--muted-foreground))"
                  }
                },
                React.createElement("span", { className: "sm-inline" }, "次話"),
                React.createElement(Icon, { w: 16, h: 16, d: ["m9 18 6-6-6-6"] })
              )
            : React.createElement("span", { style: { width: "3rem" } })
        ),
        next &&
          nextChapter &&
          React.createElement(
            "p",
            {
              style: {
                marginTop: "1.5rem",
                textAlign: "center",
                fontFamily: "var(--font-body)",
                fontSize: "0.75rem",
                color: "hsl(var(--muted-foreground) / 0.7)",
                letterSpacing: "0.05em"
              }
            },
            nextChapter.title
          ),
        !next &&
          React.createElement(
            "p",
            {
              style: {
                marginTop: "1.5rem",
                textAlign: "center",
                fontFamily: "var(--font-heading)",
                fontSize: "0.875rem",
                letterSpacing: "0.2em",
                color: "hsl(var(--muted-foreground) / 0.7)"
              }
            },
            "── 完 ──"
          )
      )
    )
  );
}

function App() {
  const route = useHashRoute();
  const [meta, setMeta] = useState(() => ({ ...defaultNovelMeta }));
  const [chapters, setChapters] = useState(() =>
    defaultChapters.map((c) => ({ ...c, paragraphs: [...c.paragraphs] }))
  );
  const [editing, setEditing] = useState(false);
  const [saving, setSaving] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [showLogin, setShowLogin] = useState(false);

  useEffect(() => {
    if (!auth) {
      setAuthReady(true);
      return;
    }
    const unsub = auth.onAuthStateChanged((u) => {
      setUser(u);
      setAuthReady(true);
      if (!u) setEditing(false);
    });
    return () => unsub();
  }, []);

  // まずローカルのデフォルトで画面を出し、Firestore は裏で同期する
  useEffect(() => {
    setLoaded(true);
  }, []);

  useEffect(() => {
    let cancelled = false;

    const applyData = (data) => {
      if (!data) return;
      if (data.meta) {
        setMeta({
          ...defaultNovelMeta,
          ...data.meta,
          characters: data.meta.characters || defaultNovelMeta.characters,
          timeline: data.meta.timeline || defaultNovelMeta.timeline
        });
      }
      if (data.chapters && Array.isArray(data.chapters) && data.chapters.length) {
        setChapters(
          data.chapters.map((c) => ({
            num: c.num,
            title: c.title || "",
            paragraphs: Array.isArray(c.paragraphs) ? c.paragraphs : []
          }))
        );
      }
    };

    (async () => {
      try {
        const data = await loadNovelViaRest();
        if (cancelled) return;
        if (data) {
          applyData(data);
          console.info("Firestore REST data loaded");
          return;
        }
        console.info("No Firestore doc via REST — using defaults");
      } catch (restErr) {
        console.warn("REST load failed, trying SDK:", restErr);
      }
      try {
        if (!db) return;
        const snap = await Promise.race([
          db.collection("novel").doc("main").get(),
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error("Firestore timeout")), 8000)
          )
        ]);
        if (cancelled) return;
        if (snap && snap.exists) {
          applyData(snap.data());
          console.info("Firestore SDK data loaded");
        }
      } catch (err) {
        console.warn("Firebase load failed, using defaults:", err);
        if (!cancelled) setLoadError(String(err && err.message ? err.message : err));
      }
    })();

    return () => {
      cancelled = true;
    };
  }, []);

  const markDirty = useCallback(() => setDirty(true), []);

  const updateMeta = useCallback((partial) => {
    setMeta((m) => ({ ...m, ...partial }));
    setDirty(true);
  }, []);

  const updateChapterTitle = useCallback((num, title) => {
    setChapters((chs) =>
      chs.map((c) => (c.num === num ? { ...c, title } : c))
    );
    setDirty(true);
  }, []);

  const updateParagraph = useCallback((num, index, text) => {
    setChapters((chs) =>
      chs.map((c) => {
        if (c.num !== num) return c;
        const paragraphs = [...c.paragraphs];
        paragraphs[index] = text;
        return { ...c, paragraphs };
      })
    );
    setDirty(true);
  }, []);

  const saveToFirebase = useCallback(async () => {
    if (!auth || !auth.currentUser) {
      alert("保存するにはログインが必要です。EDIT からログインしてください。");
      setShowLogin(true);
      return;
    }
    setSaving(true);
    const payload = {
      meta: meta,
      chapters: chapters,
      updatedAt: new Date().toISOString()
    };
    try {
      const idToken = await auth.currentUser.getIdToken();
      try {
        await saveNovelViaRest(payload, idToken);
        setDirty(false);
        setEditing(false);
        console.info("Saved via REST");
        return;
      } catch (restErr) {
        console.warn("REST save failed, trying SDK:", restErr);
      }
      if (!db) throw new Error("Firestore に接続できません");
      await db.collection("novel").doc("main").set({
        meta: meta,
        chapters: chapters,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      setDirty(false);
      setEditing(false);
      console.info("Saved via SDK");
    } catch (err) {
      console.error("Save failed:", err);
      alert("保存に失敗しました: " + (err && err.message ? err.message : err));
    } finally {
      setSaving(false);
    }
  }, [meta, chapters]);

  const logout = useCallback(async () => {
    try {
      if (auth) await auth.signOut();
      setEditing(false);
      setShowLogin(false);
    } catch (err) {
      console.error("Logout failed:", err);
    }
  }, []);

  const ctx = {
    meta,
    chapters,
    editing,
    setEditing,
    saving,
    dirty,
    updateMeta,
    updateChapterTitle,
    updateParagraph,
    saveToFirebase,
    user,
    showLogin,
    setShowLogin,
    logout
  };

  let page;
  if (!loaded) {
    page = React.createElement(
      "main",
      {
        style: {
          minHeight: "100vh",
          background: "var(--charcoal)",
          color: "var(--offwhite)",
          display: "flex",
          alignItems: "center",
          justifyContent: "center"
        }
      },
      React.createElement(
        "p",
        {
          className: "font-display",
          style: { letterSpacing: "0.3em", fontSize: "0.85rem", opacity: 0.6 }
        },
        "Loading…"
      )
    );
  } else if (route === "/" || route === "") {
    page = React.createElement(Home);
  } else if (route === "/contents") {
    page = React.createElement(Contents);
  } else if (route.startsWith("/read/")) {
    page = React.createElement(Read, { route });
  } else {
    page = React.createElement(
      "main",
      {
        style: {
          minHeight: "100vh",
          background: "var(--offwhite)",
          color: "var(--charcoal)",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          padding: "0 1.5rem"
        }
      },
      React.createElement(
        "div",
        { style: { textAlign: "center" } },
        React.createElement(
          "p",
          {
            className: "font-heading",
            style: { fontSize: "1.5rem", letterSpacing: "0.1em", marginBottom: "1.5rem" }
          },
          "ページが見つかりません"
        ),
        React.createElement(
          "a",
          {
            href: "#/",
            style: {
              fontFamily: "var(--font-body)",
              fontSize: "0.875rem",
              color: "var(--charcoal)",
              opacity: 0.6
            }
          },
          "表紙へ戻る"
        )
      )
    );
  }

  return React.createElement(
    NovelContext.Provider,
    { value: ctx },
    React.createElement(
      React.Fragment,
      null,
      page,
      React.createElement(PageFlash),
      loaded && React.createElement(EditToolbar)
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
