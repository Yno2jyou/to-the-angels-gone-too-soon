    title: "青山のギャラリー、霧に包まれる森",
    paragraphs: [
      "　翌朝、目を覚ましてまず確認したのは、やはりあの画面だった。既読のまま、何も変わっていない。僕はその事実に、安堵とも失望ともつかない宙ぶらりんの感情を抱えたまま、一日を過ごし始めた。仕事は以前にも増して手につかなかった。クライアントからのメールに目を通しても、文字が意味を結ばないまま視線だけが行を滑り落ちていく。僕はペンタブレットを握る手を何度も止め、窓の外を見た。空はいつもと変わらぬ曇り空で、遠くのビルの輪郭が霞んだ大気の中にぼんやりと溶け込んでいた。その景色を眺めながら、僕はふと、あの霧の風景のアイコンを思い出した。輪郭を失いつつあったあの森の画像。既読がついたということは、少なくとも彼のアカウントはまだこの世界のどこかに残されているということだ。しかしそれ以上の手がかりは何もなかった。",
      "　そんなある日、僕はデザイン事務所での作業の合間に、青山のギャラリーで開催されている写真展の案内をたまたま目にした。クライアントの一人がそのギャラリーのウェブサイトのリニューアルを依頼していた関係で、僕はそのDMを資料として受け取っていたのだった。「風景の不在」という展示タイトルと、モノクロームの霧に覆われた森の写真が案内状の表紙を飾っていた。僕はその写真を一目見た瞬間、胸の奥に鈍い痛みにも似た奇妙な既視感を覚えた。それは響己のメッセージアプリのアイコン画像とどこか似た質感を持つ写真だった。僕は特に深く考えることもなく、その案内状を鞄の中に入れた。ただその日一日、僕の頭の片隅には、その霧の写真の残像がずっとちらついていた。仕事を終え帰路につく途中、僕はふとその足を駅とは反対の方向へと向けていた。理由らしい理由はなかった。ただ身体が勝手にそちらへと吸い寄せられていったのだ。",
      "　気づけば、僕は青山通り沿いのあのギャラリーの入るビルの前に立っていた。白い外壁のビルは周囲の喧騒から静かに切り離された空気を纏っている。僕はしばらくその入り口を見上げたまま立ち尽くしていた。中に入るべきかどうか迷いがあった。しかしあの案内状の霧の写真が頭の中からどうしても離れなかった。僕は結局その白い階段をゆっくりと上り、ギャラリーの中へと足を踏み入れた。",
      "　ギャラリーの内部は想像していたよりも広く、天井が高かった。白い壁面に大判の写真作品が一定の間隔を空けて並んでいる。企画展のタイトルは『風景の不在』。写真家は一貫して人の気配が完全に消え去った場所ばかりを撮影しているようだった。誰もいない駅のホーム。灯りの落ちたオフィスビルの内部。廃墟になったまま放置された地方の遊園地。どの写真にも共通して、生活の痕跡だけが生々しく残されていた。壁に貼られたままの色褪せたポスター。床に転がった一足だけの子供靴。誰かが最後まで使っていたであろう埃をかぶったデスクの上のマグカップ。僕はその写真の一枚一枚を、時間をかけて丁寧に見て回った。人の姿はどこにも写っていない。しかしそこには確かに人が生きていた痕跡が色濃く残されている。その矛盾した情報──不在でありながら存在の証拠に満ちている──という状態こそが、この展示の核心なのだろうと僕は理解した。そしてその理解と共に、ある考えが僕の中に静かに浮かび上がってきた。",
      "　あの世田谷の部屋には、それがなかったのだ。あの部屋には不在すらなかった。不在という状態が成立するためには、少なくともかつてそこに何かが在った、という前提が必要になる。しかし響己の部屋には、その前提そのものが存在しなかった。塵一つない床。皺一つないシーツ。空っぽのサニタリーボックス。それらは単に今、誰もいないという不在の状態を示しているのではない。むしろその空間そのものが生活というものを最初から一度も経験したことがないということを雄弁に物語っていた。ここに写っている、誰もいなくなった廃墟の遊園地の方がよほど生々しい。少なくともこの写真の中の遊園地には、かつて無数の子供たちの笑い声が確かに響き渡っていたはずなのだから。僕はその考えに囚われたまま展示室の奥へと進んでいった。一番奥の壁にはひときわ大きなサイズの写真が一枚だけ掛けられていた。それは深い霧に包まれた針葉樹の森を写した写真だった。僕はその写真の前で思わず足を止めた。心臓が大きく跳ね上がる。それは響己のメッセージアプリのアイコン画像と驚くほどよく似た構図だった。もちろんまったく同じ写真であるはずはない。しかしその霧の質感、木々の輪郭の曖昧さ、光の届かない奥行きの深さ。それらすべてが、あの僕が何度も拡大して見つめてきた、あの小さな画像の記憶と鋭く重なり合った。僕はキャプションのプレートに視線を落とした。",
      "　作品タイトルは『不在の証明』。撮影場所は記載されておらず、ただ撮影者の言葉として、短い一文だけが添えられていた。",
      "「霧の中では、そこに何があるのかを決して確かめることができない。しかし霧そのものは、確かにそこに在る」",
      "　僕はしばらくの間、その写真の前に立ち尽くしていた。他の来場者が時折、僕の背後を通り過ぎていく気配があった。彼らの足音、囁くような話し声、パンフレットをめくる紙の音。それらの些細な生活音が、この静謐な展示室に確かな人間の温度を与えていた。僕はその温度に無意識のうちに縋りついていた。しかしそのときだった。僕の視界の端、展示室の入り口の方向に見覚えのある人影がふと映り込んだ。僕は反射的にその方向へと視線を向けた。心臓が一瞬にして凍りついたように、その動きを止めた。入り口の受付カウンターの前に、一人の男が立っていた。生成り色のコート。あの日、表参道の路地裏で見た、あの服装だった。響己だった。",
      "　彼は受付のスタッフと何か言葉を交わしていた。その姿は以前と何ら変わらない、あの完璧な静謐さを湛えていた。しかし僕がその場に立ち尽くしたまま身動きが取れずにいるうちに、彼は受付スタッフに軽く会釈をすると、そのまま展示室の中へと足を踏み入れてきた。僕は咄嗟に近くにあった別の写真作品の陰に、身を隠すようにして身体を移動させた。心臓が痛いほどに速く脈打っている。息を潜めながら、僕は作品の額縁の端から、そっと彼の様子を窺った。響己は展示室の中央あたりで足を止めていた。彼は僕がいる場所からは少し離れた位置にある、別の写真──誰もいない小学校の教室を写した写真──の前に立ち、その作品を静かに見つめていた。僕はその横顔に感情の揺らぎのようなものを見出そうとした。しかし今、僕の目の前にいる響己の表情には、感情の揺らぎを見せるような表情の機微は見当たらなかった。彼はいつも通りの完璧な、凪いだような静けさを湛えたまま、写真をじっと見つめているだけだった。僕はその事実に奇妙な安堵と、同時に深い落胆を覚えた。やはり彼は本当に死んでいるのだろうか。",
      "　僕はしばらくの間、その場に隠れたまま彼の様子を観察し続けた。彼は一枚一枚の写真をゆっくりとした足取りで丁寧に見て回っていた。その所作の一つひとつは、やはりこれまでと変わらず一切の無駄がなかった。歩く速度、立ち止まる位置、視線の動かし方。そのすべてが、まるであらかじめ用意された完璧な鑑賞のシークエンスを忠実になぞっているかのようだった。やがて彼は展示室の奥へと進み、僕がさきほどまで見つめていた、あの霧の森の写真の前にたどり着いた。僕は息を止めた。響己はその写真の前で長い間、立ち止まっていた。他のどの作品よりも明らかに長い時間を、彼はその一枚の前で過ごしていた。彼の視線は写真の中の深い霧の奥へと吸い込まれるように向けられていた。僕はその様子を隠れた場所からじっと見つめ続けていた。そして僕は再び気づいた。響己の横顔に、あの表情が、ゆっくりと浮かび上がってきていたのだ。それはあの夕暮れの路地裏で見たものと、まったく同じ質の翳りだった。眉間に刻まれるあの浅い、しかし確かな緊張の線。内側へと微かに引き結ばれる唇。そしてあの宇宙的な孤独を湛えた瞳。僕はその光景を、瞬きすることさえ忘れて見つめ続けた。あの表情は幻覚ではなかった。少なくとも僕一人だけが見ている、僕の脳が作り出した妄想の産物ではなかった。今この瞬間、確かに僕の目の前に、あの表情が再び現れているのだ。",
      "　僕は隠れていた場所から思い切って一歩踏み出した。額縁の陰から身体を完全に露わにする。もし彼がこちらを振り返れば、僕がここにいたということは、すぐに知られてしまうだろう。しかし僕はもう隠れ続けることができなかった。あの表情の意味をもう一度確かめたいという衝動が、僕のあらゆる躊躇を押し流していった。僕は彼に向かって、ゆっくりと歩み寄っていった。展示室の床は静かな空間の反響を強調するかのように、僕の足音を思いのほか大きく響かせた。しかし響己は僕の接近に、まったく気づいていないかのように、あの霧の森の写真を見つめ続けていた。僕は彼の背後、二メートルほどの距離まで近づいた。そこで僕ははっきりと、その言葉を聞いた。響己が誰にともなく、ごく小さな声で呟いたのだ。",
      "「……ここに、いたのか」",
      "　その声は、僕がこれまで聞いてきた、あの完璧な抑揚の整った声とは明らかに質が異なっていた。もっと低く、もっと掠れた、そしてもっと──弱々しい声だった。まるで長い間、誰にも話しかけられることのなかった人間が、久しぶりに声を発するときのような、そういう乾いた頼りない響き。",
      "　僕は思わず、その場に立ち尽くした。彼の呟きの意味を僕はうまく理解することができなかった。誰に対して彼はそう言ったのだろう。写真の中の誰もいない静謐な森に対してだろうか。それとも写真そのものに写った、あのどこか危うい霧に対してだろうか。あるいは彼自身の内側にある、誰にも語られることのない何かに対してだったのだろうか。",
      "「響己さん」",
      "　僕は震える声で彼に呼びかけた。その瞬間、響己の肩が微かに、しかしはっきりと跳ねた。それはこれまで一度も見たことのない、彼の反応だった。彼はゆっくりと僕の方へと身体を向けた。その動作にはこれまでの彼のあらゆる動作とは異なる、ある種の緩慢さとためらいのようなものが確かに含まれていた。",
      "　振り返った彼の顔には、しかし僕が期待していたような底知れない孤独の表情は、もはや残されていなかった。そこにあったのはいつものあの完璧な微笑みだった。ただその微笑みが浮かび上がるまでのコンマ数秒の間、僕は確かに、彼の顔の上を、何か別のもの──僕がこれまで一度も見たことのない生々しい驚愕の色──が、素早く通り過ぎていくのを見た気がした。",
      "「拓真さん」",
      "　彼はいつもの、あの完璧な声のトーンで僕の名前を呼んだ。しかしその声には、まだ微かな震えのようなものが僅かに残っていた。",
      "「まさか、こんなところでお会いできるとは」",
      "「僕も、驚きました。……響己さんも、写真展を見に来られていたんですね」",
      "　マンションの部屋の不在についてはなるべく触れず、僕は努めて平静を装った。",
      "「ええ。この写真家の作品を以前から気に入っていまして。展示会があると聞いて、来てみました」",
      "　響己はそう答えながら、僕の後方に視線を移した。僕がさきほどまで見つめていた、霧の森の写真を彼はもう一度、確かめるように見つめた。",
      "「拓真さんも、この写真を見ていたんですか」",
      "「はい。何だか、以前にどこかで見た景色のような気がして、目が離せなくなってしまって」",
      "　僕はそう答えながら彼の反応を注意深く観察していた。しかし響己の表情には、もはや何の変化も見られなかった。",
      "「不思議なものですね」",
      "　彼はそう言って、写真に向き直った。",
      "「同じ写真を見ていても、人によってそこに何を見出すかはまったく違う。私はこの霧の中に、ある種の──安らぎのようなものを、感じるんです」",
      "「安らぎ、ですか」",
      "「ええ。すべてが境界を失い、溶け合っていく。何が何であるかという判別そのものが意味を失っていく。そういう状態がどうも落ち着くんです」",
      "　その言葉を聞いた瞬間、僕の背筋を冷たいものが静かに、しかし確実に這い上がってきた。",
      "「……響己さんは、はっきりとした輪郭を持つことが苦手なんですか」",
      "　僕は思い切って、その質問を口にした。自分でも何故、そんな質問をしたのか正確には分からなかった。ただこの霧の写真を見つめる響己の横顔から、そういう問いが自然と口をついて出てきたのだ。響己は僕の質問に一瞬、動きを止めた。それはこれまでの彼の反応の中でも、最も長い沈黙の間だった。窓から差し込む午後の光が彼の輪郭を静かに、しかし確かに縁取っていた。",
      "「……面白いことを、聞きますね」",
      "　やがて彼はそう答えた。その声には、これまでにない微かな笑いの気配が混じっていた。",
      "「輪郭というものは誰かがそこに線を引くことによって初めて生まれるものだと、私は思っています。線を引く人間がいなければ、そこにはただ無限に続く連続した何かがあるだけです。ちなみに拓真さんは私という存在の輪郭を、どこに引いているんですか？」",
      "　その問いに、僕は答えることができなかった。",
      "「僕は……」",
      "　言葉に詰まった。",
      "「僕はあなたを完璧な人だと思っています。汚れのない、綻びのない、理想の存在だと。でも──」",
      "　僕は一度、言葉を切った。あの夕暮れの路地裏で見た、あの表情のことを僕はどうしても口にせずにはいられなかった。",
      "「でも三ヶ月前、僕は表参道の路地裏で、あなたを見かけたんです。夕暮れ時の路地の中で、あなたは誰かに見られているとは思っていなかったのだと思います。そのとき、あなたの顔には──ものすごく深い孤独のようなものが浮かんでいました」",
      "　響己は僕の言葉をじっと聞いていた。彼の表情には驚きも動揺も浮かんでいなかった。ただあの凍りついた湖面のような深い静けさが、そこにあった。しかしその静けさの奥に、僕はこれまでとは違う何か──言葉にならない微かな揺らぎのようなものを感じ取った。",
      "「……あなたを追いかけました。でも、見失ってしまいました。あの夜以来、僕はずっとあの表情の意味を考え続けています」",
      "「そうでしたか」",
      "　響己は静かに頷いた。",
      "「では拓真さんはその答えを私に直接、尋ねに来たんですね」",
      "「はい」",
      "「でも、それは偶然です。私は貴方が今日、ここに来ることを知らなかった」",
      "「ええ。本当にただの偶然です。でも──」",
      "　僕は彼の目を真っ直ぐに見つめた。",
      "「教えてください。あなたはあのとき、何を考えていたんですか」",
      "　響己はしばらくの間、僕の視線を受け止めていた。展示室には他にも数人の来場者がいたが、僕たちの周囲にはその瞬間、誰も近づいてこなかった。まるで僕たちの会話が作り出す、目に見えない緊張の膜が、周囲の人々を無意識のうちに遠ざけているかのようだった。",
      "「拓真さん」",
      "　やがて響己は静かに口を開いた。",
      "「私はあなたに一つ、聞きたいことがあります」",
      "「何ですか」",
      "「あなたはこの写真──この霧に包まれた森の写真を、どうして見つめていたんですか」",
      "　僕はその質問の意図をすぐには理解できなかった。",
      "「それは……あなたのアイコン画像に似ていたからです。あの霧のかかった森の写真。あなたのアイコンも最近、少しずつ輪郭が曖昧になっていって、まるでこの写真のように、すべてが霧に溶け込んでいくような、そういう印象を受けていました」",
      "「そうですか」",
      "　響己は静かに目を伏せた。",
      "「実は、あの私のアイコン画像は──この写真家の別の作品なんです。同じシリーズの中の一枚」",
      "「え……」",
      "「私はこの写真家の作品が好きなんです。特にこの霧をテーマにした一連のシリーズが。誰もいない場所を撮っているようで、実はそこには常に何かが確かに存在している。ただそれが霧によって隠されているだけなんです。私はそこに、ある種の──親近感のようなものを感じています」",
      "　その言葉を聞いた瞬間、僕の中でこれまでの疑念の断片が、一つの新しい輪郭を結び始めていた。もし彼のアイコン画像が単なる、彼自身が選んだ一枚の写真作品に過ぎないのだとしたら。僕がこれまでその画像の変化に見出してきた、あらゆる不気味な意味──彼という存在が少しずつこの世界から消えていくという、あの恐怖の物語──は、いったいどこまでが僕自身の妄想だったのだろうか。",
      "　しかしそれでも僕の中には、まだ消えることのない疑念が確かに残っていた。",
      "「……でも、なぜ、この写真を選んだんですか。誰もいない、輪郭の曖昧な、霧の風景を」",
      "　響己はその質問に、ゆっくりと答えを紡ぎ始めた。",
      "「拓真さん。あなたはこの写真家の言葉を読みましたか。あのキャプションに書かれていた言葉を」",
      "「はい。読みました」",
      "「『霧の中では、そこに何があるのかを決して確かめることができない。しかし霧そのものは、確かにそこに在る』」",
      "　響己はその一文を諳んじるように、正確に口にした。",
      "「私はこの言葉を初めて読んだとき、まるで自分自身のことを言い当てられているような気がしました」",
      "「自分自身のこと、ですか」",
      "「ええ」",
      "　響己はその言葉を口にしながら、僕の方へと視線を戻した。その瞳の奥には、あの路地裏で見た宇宙的な孤独の色が確かに、そこに宿っていた。",
      "「拓真さん。あなたはこれまで私という存在を、完璧というフィルターを通してしか見たことがなかった。あなたが見ていたのはいつも、私を包む、霧の方だけだったんです。その霧の奥に本当に何が──あるいは誰が──存在するのか、あなたはこれまで一度も確かめなかった」",
      "　僕はその言葉に息を呑んだ。それはまさに僕があの写真の前で一人、考えていたことと寸分違わず同じ内容だった。",
      "「では、あの霧の奥には、いったい何が──」",
      "　僕はその問いを最後まで口にすることができなかった。響己は僕の言葉を静かに遮った。",
      "「拓真さん。今、この場所で、そのすべてをお話しすることはできません」",
      "「どうして、ですか」",
      "「ここはあまりにも多くの人の目がある場所です。そして私自身、まだあなたに何を、どこまで話すべきなのか、自分の中で整理がついていないんです」",

      "　僕は思わず、そう漏らした。玄関の三和土に足を踏み入れると、床板が僕の体重を受けて、小さく軋んだ。その軋みの音さえ、記憶の底に眠っていた何かを、優しく揺り動かすようだった。僕はコートのポケットからスマートフォンを取り出し、ライトを点灯させた。白い光の輪が、埃を被った空間を、静かに照らし出していく。玄関を上がると、すぐに広いワンルームの構造になったアトリエの内部が、目の前に広がった。天井は思いのほか高く、片側の壁一面には、大きな明かり取りの窓が設けられていた。今は分厚い埃と蜘蛛の巣に覆われたその窓は、月明かりをぼんやりと透過させ、部屋全体に薄い青白い光を投げかけていた。部屋の中央には、古い木製のイーゼルが、まるで長い間、誰かの帰りを待ち続けているかのような佇まいで、静かに立っていた。イーゼルの上には、白い布に覆われたキャンバスらしきものが、そのまま乗せられている。壁には、大小さまざまな絵画が、無造作に立てかけられ、あるいは壁に直接掛けられ、埃を被ったまま、じっと沈黙を守っていた。部屋の隅には、絵具の乾いたパレットや、筆の入った古い缶、そして油の染みついた雑巾の束が、そのまま放置されている。時間が、この一室だけ、完全に止まってしまったかのようだった。",
      "「電気は、来ていないみたいですね」",
      "　響己が、僕の隣に立ちながら、静かに言った。彼の視線は、壁のスイッチへと向けられていた。",
      "「試してみよう」",
      "　僕はそのスイッチへと歩み寄り、指先で押し上げた。しかし部屋の中に光が灯ることはなかった。当然のことだった。ここに人が最後に足を踏み入れてから、もう十年以上の月日が経っているはずだ。電力会社との契約もとうの昔に切れているに違いない。",
      "「懐中電灯とか、ろうそくとか、何か明かりになるものがないか、探してみます」",
      "　僕はそう言うと、スマートフォンのライトを頼りに、部屋の隅にある小さな棚を探り始めた。棚の中には、古びた画材道具や、乾いてひび割れた絵具のチューブが、乱雑に詰め込まれていた。その中に、僕は埃を被った石油ランプと、脇に置かれた小さな一斗缶を見つけた。缶を振ると、内側でわずかに液体が揺れる音がした。",
      "「これ、使えるかもしれません」",
      "　僕はランプを手に取り、キャップを外して匂いを確かめた。かすかに油の匂いがした。まだ完全に蒸発していないらしい。僕はランプの芯に、ポケットから取り出したライターの火を近づけた。数度の失敗の後、小さな橙色の火が、芯の先端に灯った。その頼りない、しかし確かな光が、部屋の中にゆっくりと広がっていく。",
      "「良かった」",
      "　響己が、その光を見つめながら、微かに口元を緩めた。",
      "　ランプの明かりで室内を見渡すと、この場所が、僕の記憶にある姿と、驚くほど変わっていないことに気づいた。壁に立てかけられた絵の一枚一枚に、僕はランプを近づけていった。そのほとんどが、祖父が生涯を通じて描き続けてきた、山の風景画だった。しかしその画面のほとんどに共通して描かれていたのは、はっきりとした輪郭を持つ山や木々の姿ではなかった。",
      "　それは、霧だった。",
      "　深い山あいに立ち込める、白く、灰色を帯びた、濃密な霧。木々の輪郭は、その霧の中に溶け込むようにして描かれ、はっきりとした線を持たない。筆致は荒々しく、しかしその荒々しさの奥に、何か執拗な、確かめるような執念が滲んでいるように見えた。",
      "「……響己さん、これを見てください」",
      "　僕はランプを、壁際に立てられた一枚の大きなキャンバスへと近づけた。それは他の作品よりも一際大きく、そして一際、丁寧に仕上げられているように見えた。深い霧の中に、ぽつりと佇む、若い男の後ろ姿が描かれていた。その輪郭は他の要素と同じように霧に溶け込みながらも、確かにそこに、人の形として留まっていた。",
      "　響己は、その絵の前で、長い間、動くことができなかった。",
      "「これは……」",
      "「祖父が、誰を描いたのか、僕は聞いたことがありません」",
      "　僕はそう言いながら、絵の右下に小さく記されたサインへと、ランプの光を寄せた。かすれたインクの文字で、年号らしき数字が記されている。",
      "「拓真さん。この絵の日付……」",
      "「うん、間違いない。今日だ」",
      "　祖父の絵に記された日付は今日の日付と一致していた。ランプの炎が揺れ、その光が絵の右下に刻まれた数字の上を、まるで確かめるように、何度も往復した。見間違いではないかと僕は自分の目を疑い、ランプをさらに近づけた。しかし数字は変わらなかった。年、月、日。すべてが今日という一点に、寸分の狂いもなく収束していた。",
      "「どうして……」",
      "　僕はその場にへたり込みそうになるのを、辛うじて堪えた。祖父が亡くなったのは、もう十五年以上も前のことだ。僕がまだ大学生になったばかりの頃だった。その祖父がこの山小屋で最後に絵筆を握ったのがいつだったのか、正確なところは僕にも分からない。しかし少なくともこの絵が描かれたのは、祖父が生きていた当時のことであるはずだった。それなのに、そこに記された日付は今日、この瞬間と、完全に一致している。",
      "「拓真さん」",
      "　響己が僕の隣で、絵から一歩も動かずに、掠れた声で言った。",
      "「これは……偶然ではありませんよね」",
      "「偶然のはずがない」",
      "　僕はランプを持つ手を、無意識のうちに強く握りしめていた。",
      "「祖父は、今日、僕たちがここに来ることを知っていた。そして……」",
      "　僕は絵の中の霧に溶け込むようにして描かれた若い男の後ろ姿に、視線を戻した。その輪郭は確かに響己のものと重なって見えた。肩の線、首の傾げ方、佇まいの静けさ。それはこれまでの数ヶ月間、僕がずっと見つめ続けてきた、あの完璧な、しかし今は確かに人間らしい揺らぎを孕んだ、響己の姿。",
      "「この絵のモデルは……響己さんなんですか」",
      "　僕がそう問うと、響己は長い沈黙の後、ゆっくりと首を横に振った。",
      "「分かりません。私にも分からないです。ただ──」",
      "　彼はランプの明かりの中で、その絵をなぞるように、視線を上から下へと動かした。",
      "「この絵の中の男が誰であるかということよりも、私が今、もっと恐ろしく感じているのはこの絵が描かれた日付が、なぜ今日なのか、ということです。拓真さんのお祖父様は、もう十五年以上も前に亡くなられているんですよね」",
      "「そうです」",
      "「それなのに、なぜ、この絵には今日の日付が記されているのでしょうか」",
      "　僕たちはしばらくの間、その問いの前で、ただ立ち尽くしていた。ランプの炎がパチ、と小さく爆ぜる音を立てた。窓の外では山の夜特有の深く沈んだ静寂が、ゆっくりと小屋全体を包み込んでいた。",
      "「……座りましょう」",
      "　僕はそう言うと、部屋の中央に置かれた、埃を被った古い木製の椅子を二脚、引き寄せた。祖父がかつて絵を描く合間に腰掛けていたであろう、その椅子の座面には長年の使用によって、彼の体重が刻んだであろう微かな窪みが残っていた。僕はその窪みにそっと腰を下ろした。響己ももう一脚の椅子に、静かに腰掛けた。ランプを二人の間の小さなテーブルの上に置くと、その頼りない光が僕たちの顔を下から柔らかく照らし出した。",
      "「整理しましょう」",
      "　僕は自分自身に言い聞かせるように、そう切り出した。",
      "「まず、祖父はこの絵を、いつ描いたのか分かりません。日付は今日になっているけれど、それが本当に今日、この瞬間に描かれたはずがない。祖父はもう亡くなっているんですから」",
      "「ええ」",
      "「ということは、祖父はこの絵を、過去のある時点で描きながら、そこに、今日の日付を記した。それはつまり──」",
      "　僕は言葉を切り、自分の言おうとしていることの、あまりの荒唐無稽さに、一瞬躊躇した。しかしこの数ヶ月間、僕たちが体験してきたあらゆる出来事の異様さを思えば、もはやそれを躊躇う理由もないように思えた。",
      "「祖父は、今日という日に、僕とあなたがこの小屋を訪れることを、あらかじめ知っていた、ということになる」",
      "「予見していた、ということですね」",
      "「そう。でも、どうやって？ どうして祖父に、そんなことが分かったんだろう？」",
      "　響己は僕の問いに、すぐには答えなかった。彼はランプの炎をじっと見つめたまま、何かを深く考え込んでいるようだった。その横顔にはこれまでとは違う、ある種の集中の色が浮かんでいた。それは恐怖や困惑を通り越した、もっと冷静な、何かを解き明かそうとする者の表情だった。",
      "「祖父に、聞いてみたい」",
      "　僕は思わず、そう呟いていた。",
      "「祖父が生きていたら、この絵について何を語ってくれたんだろう」",
      "　響己は僕の言葉に、静かに視線を上げた。",
      "「もしかしたらこの小屋の中に、その手がかりが残されているかもしれません」",
      "「手がかり……」",
      "「拓真さんのお祖父様は、この絵を今日という日に私たちが来ることを予見して、このアトリエに残しました。それが単なる偶然でないのなら他にも何か、我々に向けて残された言葉や記録があるかもしれません」",
      "　僕はその言葉に、はっとした。そしてランプを手に、部屋の中をあらためて見回し始めた。壁際に積まれた他の絵画の数々。そして部屋の奥にある、古い木製の机。その引き出しの中に、何か祖父の言葉が残されているのではないか──そんな予感が僕の胸の中に、急速に広がっていった。",
      "　僕は立ち上がり、机の方へと歩み寄った。埃をかぶった天板に、ランプの光を近づける。引き出しの取っ手には、蜘蛛の巣が幾重にも張り巡らされていたが、僕はそれを構わず払いのけ、力を込めて引き出しを開けた。ギィ、という乾いた抵抗の音とともに、引き出しが、ゆっくりと開いていく。中には古い筆記用具や、絵具の空き容器と一緒に、数冊の革表紙のノートが収められていた。表紙は長年の湿気と乾燥を繰り返したせいか、ところどころひび割れていたが、まだ十分に手に取ることができる状態を保っていた。僕はそのうちの一冊を、震える手で取り出した。",
      "「これは……祖父の、日記だ」",
      "　僕はそう呟きながら、ページをめくった。祖父の几帳面な、しかしどこか荒々しさを孕んだ筆跡がそこには綴られていた。僕はランプの光を頼りに、その文字を一行一行、丁寧に追い始めた。響己も僕の隣に立ち、その手元を息を詰めて覗き込んでいた。やがてあるページに差し掛かったとき、僕の目はある一節に釘付けになった。そこにはこう記されていた。",
      "「今日、山の中で、不思議な男に出会った。霧の中にまるで最初からそこにいたかのように、静かに佇んでいた。彼は自分がどこから来たのか、自分でも分からないと言っていた。私はその男の姿があまりにも美しく、そして同時にあまりにも儚く見えたので、思わず絵筆を手に取った」",
      "　僕はその文字を、何度も読み返した。心臓が大きく、重く脈打っていた。",
      "「拓真さん……」",
      "　響己が掠れた声で、僕の名前を呼んだ。僕はページをさらにめくった。次のページには、こう続いていた。",
      "「彼は私にひとつの奇妙なことを言った。『いつかあなたの孫が、私を連れて、あなたのアトリエへとやってくる』と。私はその言葉を、男の戯言だと思って笑った。しかし彼の瞳はあまりにも真剣で、あまりにも澄み切っていた。だから私はその言葉を信じることにした。そしていつかその日が来たときのために、この絵に、ある日付を書き記しておくことにする」",
      "　僕はその文字を読み終えた瞬間、絵の右下に記された日付を、もう一度、確認した。それは間違いなく、今日の日付だった。",
      "「祖父は……あなたと出会っていたんですね」",
      "　僕は震える声で、そう言った。",
      "「でも、それはいつのことだったんだろう。祖父がこの日記を書いたのは──」",
      "　僕は日記の別のページを探り、日付が記されている箇所を探し始めた。しばらくして僕はその記述の始まる少し前のページに、はっきりと記された日付を見つけた。それは祖父が亡くなる、ちょうど十年前のことだった。",
      "「十年前……」",
      "　僕は呆然と、その数字を見つめた。",
      "「響己さん。あなたはその頃、どこにいたんですか。堂島さんの話では圭一さんと響の物語は五年前に終わっている。あなたが表参道で僕とすれ違ったのは、たった数ヶ月前のことです。祖父がこの絵を描いたのは、それよりもさらに前──」",
      "「拓真さん」",
      "　響己が僕の言葉を、静かに遮った。",
      "「私の頭に、今ひとつの考えが浮かんでいます」",
      "　響己の声が冷たく、先鋭に冴え渡る。",
      "「とても奇妙な考えですが聞いていただけますか」",
      "「もちろんです」",
      "　僕は身を乗り出した。この数ヶ月間、僕たちは常に、答えの見えない霧の中を手探りで歩き続けてきた。しかし今、響己の瞳の奥にはこれまで見たことのない種類の静かな確信の光が宿り始めているのを僕は見て取った。",
      "「私と、私をめぐる世界は」",
      "　響己はゆっくりと言葉を選ぶように話し始めた。",
      "「拓真さんと、拓真さんをめぐる世界とは、根本的に異なるのではないかと思うんです」",
      "「根本的に異なる？」",
      "　響己は頷いた。",
      "「拓真さんの生きる世界が、過去に原因を含有し、未来に結果を含有するのならば」",
      "　響己はそこで一度、深く息を吸った。",
      "「私の生きる世界は、未来に原因を含有し、過去に結果を含有する」",
      "　僕はその言葉を頭の中で反芻した。しかしその意味は、すぐには像を結ばなかった。",
      "「それはつまり──あなたにとっては、時間が逆に流れている、ということですか」",
      "「逆に、というのとは少し違うと思います」",
      "　響己はテーブルの上のランプをじっと見つめたまま、ゆっくりと首を振った。",
      "「もう少し、整理して考えてみましょう」",
      "　響己はテーブルの上に置かれたランプの炎を見つめながら、静かに続けた。",
      "「普通、私たちが生きているこの世界では原因が先に立ち、結果が後からついてくる。石を投げれば、水面に波紋が広がる。種を蒔けば、やがて芽が出る。誰かと出会えば、そこから関係が築かれる。拓真さんの生きる時間の流れは、そういうものです」",
      "「ええ。それが普通です」",
      "「でも、私の場合は、その順番そのものが、ひっくり返っているのかもしれません」",
      "　響己はそこで言葉を切り、膝の上で組んだ両手に視線を落とした。",
      "「圭一さんの願いが、私という存在を生み出した『原因』であることは、今になっては間違いないはずです。堂島さんの話を聞いた限りでは。でも、もしその原因が、時間の流れの中で、結果よりも後に置かれているのだとしたら」",
      "「後に置かれている……つまり、あなたという存在が先に生まれて、その後で、原因である圭一さんの願いが生まれる、ということですか」",
      "「はい。順番としては、そうなります」",
      "　僕はその言葉の意味を、頭の中で必死に組み立て直そうとした。",
      "「でもそれだと卵が先か、鶏が先かという古典的な因果律の話にすらない。卵と鶏の話はどちらが原因で、どちらが結果であるかという問いなのに対し、あなたが言ったことは結果が原因より先行し、それを生み出したはずの原因が後からやってくるということになる。理屈としてはとても成立し得ない」",
      "「ええ、拓真さんの世界の理屈では、絶対に成立しないはずのことです。でも──」",
      "　響己はランプの炎に視線を戻し、静かに続けた。",
      "「祖父様が霧の中で出会ったという私は、日記の日付から言えば、圭一さんが響という人に出会うよりも、さらに前に存在していたことになります。もし私が本当に圭一さんの願いから生まれた結果であるならば、原因であるはずのその願いが芽生えるよりも前に、私はすでにこの世界のどこかに、結果として立っていたことになる」",
      "「原因より先に、結果が存在している」",
      "「はい。だから私にとっての時間はこう考えるしかないんです。私という存在の輪郭を決定づける『原因』は、時間の川で言えば、下流──つまり未来の側に置かれている。そして私という存在そのもの、つまり『結果』は、その原因よりもずっと上流、つまり過去の側に、先に置かれてしまっている」",
      "「未来にある原因が、過去にある結果を生み出している……いや、生み出すという言い方も、変ですね。順番から言えば」",
      "「ええ、『生み出す』という言葉自体が、原因が先にあることを前提にした言葉ですから、正確ではないのかもしれません。もっと近い言い方をするなら──未来で発生する原因が、過去にすでに置かれている私という結果に向かって、遡るようにして、影響を及ぼし続けている。そういう構造なんだと思います」",
      "　僕はしばらくの間、言葉を発することができなかった。ランプの炎が、パチリと小さく爆ぜた。",
      "「だから、祖父はあなたに出会うことができた。圭一さんの願いが生まれるよりも前に」",
      "「はい。祖父様から見れば、あの霧の中で出会った私はまだ何の原因も持たない、輪郭だけがそこにある存在だったはずです。でも私自身の中には、まだこの世界で発生してすらいない、未来の原因──圭一さんの願い──がすでに波及した形として、刻み込まれていた。だから私は祖父様に、まだ起きていないはずの未来を、まるで知っているかのように語ることができた」",
      "「つまりあなたが祖父に伝えた『いつかあなたの孫が、私を連れて、あなたのアトリエへとやってくる』……あれは予言だったんじゃない。あなたにとってはもう起きたことと同じだった、ということですか」",
      "「そうかもしれません。拓真さんとの出会いも、この旅も、この今この瞬間、あなたと二人でこの小屋に座っていることも──私にとっては、時間を遡って、私という結果の中に、すでに波及し終えていた出来事だったのかもしれません」",

      "　響己はそう言って、微かに笑った。その笑みはこれまでの数ヶ月間、僕がずっと見つめ続けてきた、あの完璧な微笑みと──どこか寸分の狂いもなく同じもののように見えた。箱根から戻り、疲れ果てて眠りに落ちる前、確かに彼の笑顔には、以前にはなかった不揃いさがあったはずだった。目尻の下がり方、口角の上がる速度、そのすべてに人間らしい微かなノイズが宿っていたはずだった。しかし今、目の前にある彼の笑顔にはそのノイズが綺麗に消え去っているように見えた。",
      "「……響己さん」",
      "「はい？」",
      "「さっきの笑い方、なんだか、久しぶりに見た気がします」",
      "「久しぶり、というのは」",
      "「あの、世田谷のマンションで最初に会った頃の、あの、完璧すぎる笑い方です」",
      "　響己は少し首を傾げ、それから、また同じ角度で、同じ速度で微笑んだ。",
      "「そうですか？ 自分では、あまり意識していませんでした」",
      "　やかんが甲高い音を立てて沸騰し始めた。僕は慌てて火を止め、湯気の立ちのぼる水を、二つのマグカップに注いだ。ティーバッグを浸すと、薄い茶色が湯の中に、ゆっくりと広がっていく。その広がり方を見つめながら、僕は自分の胸の奥に小さな、しかし確かな違和感の棘が、深く刺さっていくのを感じていた。リビングに戻り、テーブルにマグカップを置く。湯気が二人の間に、細く立ちのぼった。",
      "「祖父の日記の続きを、読んでみましょうか」",
      "　僕はそう言って、ふたたびノートを開いた。しかし、あるページを開いた瞬間、僕は自分の目を疑った。そこには先ほど確かに読んだはずの、霧の中で祖父が響己と出会ったという記述がまったく同じ文章でもう一度、記されていた。いや──正確に言えば、それは同じ文章ではなかった。一字一句、まったく同じというわけではない。しかしその内容と、そこに込められた感情の輪郭は先ほど読んだものと、恐ろしいほど似通っていた。",
      "「……あれ」",
      "「どうしましたか」",
      "「いや……この部分、さっきも読んだ気がして」",
      "　僕はページを前後にめくり直した。しかし先ほど確かに読んだはずのページの位置が、どうしてもうまく見つからなかった。ノートの厚みは変わっていないはずなのに、ページをめくる指の感触が、なぜか、これまでよりも軽く、頼りないものに感じられた。",
      "「拓真さん、大丈夫ですか。顔色が優れないようですが」",
      "「……ええ、大丈夫です。ちょっと、疲れが出ているだけだと思います」",
      "　僕はノートを閉じ、テーブルの上に置いた。マグカップから立ちのぼる湯気を見つめる。その湯気の揺らめき方が、どこかひどく緩慢に見えた。まるで映像を、少しだけスロー再生しているかのような、そんな違和感が拭えなかった。",
      "「少し、窓を開けてもいいですか」",
      "　僕はそう言って、リビングの窓に近づいた。カーテンを開け、鍵を回してサッシを引く。夜の空気が、部屋の中へと流れ込んできた。しかしその空気には、これまで僕が幾度となく感じてきた、あの東京の夜特有の、排気ガスと湿気の混ざった匂いが、ほとんど感じられなかった。代わりに漂ってきたのはひどく薄く、無臭に近い、まるで空気清浄機を通したばかりのような、清潔すぎる冷たさだった。",
      "「……響己さん」",
      "　僕は窓の外を見つめたまま、彼の名前を呼んだ。",
      "「はい」",
      "「今、何時だと思いますか」",
      "「さあ……夕方の五時か、六時くらいでしょうか」",
      "　僕はポケットからスマートフォンを取り出し、画面を確認しようとした。しかし画面に表示されているはずの時刻の数字が、あの箱根の不吉なカーブの中で見たときと、まったく同じように輪郭を失って、じわりと滲んで見えた。僕は目を強く瞬き、もう一度画面を見つめ直した。しかし数字は、依然として、水に溶けたインクのように、判読できないままだった。心臓が急速に脈打ち始めた。僕はスマートフォンをテーブルの上に置き、深呼吸をした。落ち着け、と自分に言い聞かせる。ただの疲労だ。長時間の運転と、あの不吉なカーブと、山小屋での発見と、それらすべてが積み重なって、僕の神経を過敏にさせているだけだ。そう考えようとした。しかしその説明では説明のつかない何かが、確実に、この部屋の空気の中に混ざり込んでいるという確信が、拭い去れなかった。",
      "「拓真さん、座ってください。顔が真っ青です」",
      "　響己が僕の腕にそっと手を添えた。その手の感触はあの世田谷の部屋で最初に触れられたときのような、凍りつくような冷たさではなかった。しかしそれでもなお、生きた人間の体温とは何かが決定的に違う、そんな微かな違和感が、皮膚を通して伝わってきた。僕はソファに腰を下ろした。響己も、向かいの椅子に座り直す。その仕草──座るときの角度、背筋の伸ばし方、膝の位置──そのすべてが、あの表参道で初めて出会った日、そして世田谷のマンションで対峙し続けたあの数ヶ月間、僕が幾度となく観察し続けてきた、あの寸分の狂いもない完璧な所作と、恐ろしいほど一致していた。",
      "「響己さん」",
      "　僕はゆっくりと、声を絞り出した。",
      "「長野での旅の間、僕たちは、確かに変わったはずですよね。あなたは椅子に座るとき、少し音を立てるようになった。歩くとき、足音を立てるようになった。あなたの手は僕の手を握ったとき、確かな体温を持っていた」",
      "「ええ」",
      "「でも、今のあなたは、なんだか……最初の頃の、あの、完璧すぎるあなたに、また戻っているように見えるんです」",
      "　響己は僕の言葉をしばらくの間、じっと聞いていた。その表情には驚きも、動揺も、浮かんでいなかった。ただあの凍りついた湖面のような、完全な静けさだけが、そこにあった。",
      "「拓真さん」",
      "　彼はやがて、静かに口を開いた。",
      "「その質問に、私はうまく答えることができません。なぜなら私自身には、自分がどう変わって、どう戻ったのか、把握することができないからです」",
      "「……それは、変な話じゃないですか。さっきまで、あなたは自分の変化について、ずいぶん論理的に説明してくれていたのに」",
      "「ええ、確かにそうかもしれません」",
      "　響己はそう認めた。しかしその声のトーンにはこれまでの誠実な戸惑いとは違う、どこか他人事のような平坦な響きが混じっているように聞こえた。僕はマグカップを手に取り、まだ湯気の立つ茶を、一口すすった。しかしその温度が、口の中に入った瞬間の感触が、ひどく曖昧だった。熱いのか、それとも生ぬるいのか、うまく判断ができない。まるで味覚そのものが、僕の身体から少しずつ、切り離されていくかのような感覚だった。",
      "「拓真さん、続きを話しましょう」",
      "　響己がそう促した。僕はその言葉に従い、また日記を開こうとした。しかしその瞬間、僕の指先に触れたノートの表紙の感触が、先ほどまでとは、明らかに違うものになっていることに気づいた。革の質感がひどく滑らかで、まるで新品のように傷ひとつない状態に戻っていた。僕はページを開いた。しかしそこに記されていたはずの祖父の筆跡はどこにも見当たらなかった。すべてのページが真っ白なまま、僕の目の前に広がっていた。",
      "「……ない」",
      "　僕は呆然と、そのページをめくり続けた。一枚、また一枚。どのページにも、文字は一切、記されていなかった。",
      "「どうしましたか」",
      "「日記が……祖父の言葉が、消えている」",
      "　僕は震える手で、そのノートを響己に差し出した。彼はそれを受け取り、静かにページをめくった。",
      "「本当ですね。何も書かれていません」",
      "　その反応はあまりにも落ち着いていた。まるでそれが当然の結果であるかのように、彼はそのノートをなんの動揺もなく、テーブルの上に置いた。僕は立ち上がり、部屋の中を見回した。壁にかけられた時計。それは僕がこのマンションに越してきたときから、ずっとそこにあるはずのごくありふれた掛け時計だった。しかし今、その針は五時十五分を指したまま、まったく動いていないように見えた。僕は近づき、秒針の動きを確かめようとした。しかし、どれほど目を凝らしても、その細い針が、微塵も動く気配がなかった。",
      "「時計が……止まっている」",
      "「電池が切れているのかもしれませんね」",
      "　響己があくまで淡々とした声で言った。僕は玄関へと向かった。ドアを開け、廊下の様子を確認しようとした。しかしいつも見慣れているはずの、あのマンションの共用廊下の景色が、そこには広がっていなかった。目の前にあったのは無機質な、真っ白な壁だけだった。廊下も、隣室のドアも、非常灯の緑色の光も、そのどれもが、そこには存在しなかった。ただ果てしなく続く、白い壁だけが、僕の視界いっぱいに広がっていた。僕はドアを閉め、後ずさった。心臓が、耳の奥で激しく脈打っていた。",
      "「拓真さん、どうしたんですか」",
      "　響己が、僕の背後から声をかけてきた。振り返ると、彼はソファに座ったまま、こちらを穏やかに見つめていた。",
      "「廊下が……ないんです。ドアの外に、白い壁しかない」",
      "「そうですか。それは、大変ですね」",
      "　その返答は、あまりにも他人事めいていた。まるで僕の言葉の内容が、彼の中で、ほとんど何の意味も持っていないかのようだった。僕はその瞬間、これまで見過ごしてきた、無数の小さな違和感が、一気に頭の中で結びついていくのを感じた。祖父の日記が突然、白紙に戻ったこと。時計の針が止まっていること。窓の外の空気が、あまりにも無臭であること。響己の笑い方が、あの完璧すぎる、最初の頃のものに戻っていること。そして彼が僕の言葉に対して見せる、どこか台本を読んでいるかのような、平坦な反応。",
      "「響己さん」",
      "　僕は掠れた声で、彼の名前を呼んだ。",
      "「はい」",
      "「僕は、いつあの山小屋を出たんでしょうか」",
      "「今朝早くです。空が白み始めた頃でした」",
      "「そこから、車を運転して、東京に戻ってきた」",
      "「はい」",
      "「あのカーブを、また通り抜けて」",
      "「そうです」",
      "「マンションに着いて、地下駐車場に車を停めて、部屋に戻って……それから、僕は眠った」",
      "「ええ」",
      "「そして、夕方に目が覚めた」",
      "　僕はそこまで言って、言葉を止めた。その一連の記憶を順を追って辿り直していく中で、僕はある一点に、決定的な違和感を覚えていた。夕方に目が覚めた。あの瞬間、確かに僕はベッドの上で目を開けた。カーテンの隙間から差し込む茜色の光を見て、僕は自分が眠っていたことを、はっきりと自覚した。その感覚はこれまでの人生で幾度となく経験してきた、ごくありふれた覚醒の感覚と、何ら変わりないものだった。皮膚に触れるシーツの感触、目蓋の重さ、寝起き特有の口の中の乾き。それらすべてが、疑いようのない現実として、僕の身体に、確かに宿っていた。しかしその後――リビングに移動し、響己と再会し、山小屋での出来事を整理し始めた、この一連の会話。その時間の中には、あの覚醒の瞬間にあったはずの、生々しい身体感覚が、次第に希薄になっていっているのではないか。僕はもう一度、自分の手のひらを見つめた。それを強くつねってみる。痛みは確かに感じられた。しかしその痛みの質が、あの霧の森で膝をついたときや、あの寺の墓地の前で立ち尽くしたときに感じた、あの生々しい、皮膚を刺すような痛みとは、どこか違うもののように思えた。もっと、ぼんやりとした、遠くから伝わってくるような、そういう痛みだった。",
      "「響己さん」",
      "　僕は震える声で、再び彼に問いかけた。",
      "「僕は今、本当に、目を覚ましているんでしょうか」",
      "　響己はその問いに、しばらくの間、答えなかった。ただ僕の目をまっすぐに見つめ続けていた。その静けさが、これまでのどの瞬間よりも、恐ろしく感じられた。",
      "「拓真さん。それは、どういう意味ですか」",
      "「……分からない。でもなんだか、すべてがおかしいんです。時計は止まっているし、廊下は消えているし、祖父の日記は白紙に戻っている。あなたの笑い方は、また完璧すぎるものに戻っている。まるで――」",
      "　僕はその先の言葉を、一瞬、口にすることを躊躇した。しかしもう後戻りはできないという確信が、胸の奥から突き上げてきた。",
      "「まるで、僕がまだあのベッドの上で、眠り続けているみたいだ」",
      "　その言葉を口にした瞬間、部屋の中の空気が明らかに変わったのを僕は肌で感じた。天井の照明の光が一瞬だけ、明滅した。それはほんの一瞬のことだったが、確かに僕の視界の端で、その光の揺らぎを捉えた。",
      "「響己さん、正直に答えてください」",
      "　僕は立ち上がり、彼の前に立った。",
      "「あなたは本当に、あの山小屋から、僕と一緒に車で戻ってきたんですか。それとも――」",
      "「それとも？」",
      "「僕は今も、まだあの誕生日の夜のソファの上で、眠っているんですか。あるいは箱根に向かう車の中で。あるいはもっと前、あの世田谷のマンションの、あの無菌室のような部屋で、ずっと」",
      "　響己はゆっくりと立ち上がった。彼の輪郭が部屋の照明の光の中で、微かに揺らいで見えた。それはあの箱根のカーブの中で見た彼の姿が二重、三重に重なって見えたときの、あの異様な視覚的混乱と、よく似ていた。",
      "「拓真さん」",
      "　彼はそう言うと、僕の頬にそっと手を伸ばした。その手のひらは、これまでで最も冷たかった。",
      "「あなたは、いったい何を求めているんですか？」",
      "　その言葉が部屋の空気に溶け切らないうちに、ふと彼の右の瞳が不自然に歪んだ。瞬きすら挟まず、その瞼の奥から、乾いた硬質な音が響く。白く丸いピルのような錠剤が一粒、また一粒と瞳孔を押し出すようにして溢れ出てくる。ポロポロと音を立てて落ちるそれは、無機質な床に当たって跳ね、僕の足元まで転がっていった。一つや二つではない。まるでとめどなく溢れる涙のように、無数の白い錠剤が彼の頬を滑り落ちていくのだった。",
      "「響己……さん……？」",
      "　僕の声は途切れ、酷く掠れていた。呼気とともに絞り出した音は、自分の耳にすら届いているのか怪しいほどに小さかった。視界の端で揺れるリビングの景色、テーブルの上のグラス、壁に飾られた時計、それら全てが急激に現実味を失っていく。脳の奥で警報が鳴り響き、いま目の前で起きている事象を記憶として記録することを激しく拒絶していた。しかし異変はそれだけでは終わらなかった。響己は自身の身に起きた異常に困惑したように、両手を激しく震わせながら目元へと持っていった。長い指が目蓋を強く覆い隠す。だが指の隙間から押し出されるようにして、今度は別の液体が漏れ出し始めた。最初は、透明な涙だと思った。しかし指の関節を伝って垂れてきたのは、粘り気のある、重く濁った液体だった。濃度を増した体液には濃密な血が混じり込んでおり、赤黒い筋となって彼の白い手首を汚していく。",
      "「あ……くっ……あ……」",
      "　彼の手が顔面から力無く滑り落ちた。露出した響己の瞳孔は、すでに元の色を失っていた。真っ赤な血が左右の目から溢れ出し、目尻を伝い、顎のラインを伝って、首元へと流れ落ちていく。彼が身にまとっていた純白のカーディガンの胸元に、一滴、また一滴と赤黒いシミが広がっていった。染みは瞬く間に繊維を吸い上げ、円を描くようにして広がり、白かった生地を重く、黒ずんだ赤へと変貌させていく。",
      "「ああ……あ、拓真……さん……っ」",
      "　喉の隙間から漏れ出たその声には、かつて僕を惹きつけた高貴な音色は一切残っていなかった。まるで割れたガラスの破片を喉の奥に何枚も詰め込まれ、それを無理やりに絞り出しているかのような、酷く嗄れた惨めな叫びだった。響己は自分の首元を爪が食い込むほど激しくかき毟った。喉の皮膚に赤い線が走り、そこからも血が滲む。彼は限界まで口を大きく開けた。",
      "「ヒッ……っ！」",
      "　短く、高い悲鳴が彼の口から漏れた。彼の膝が折れ、ドサリと重い音を立ててフローリングの上に倒れ込む。",
      "「うっ、おぐっ……！ あああっ！ ぐ、あぁっ！」",
      "　響己は背中を大きく波打たせ、激しい嗚咽を漏らし始めた。肩が狂ったように上下し、肋骨の浮き出た胸郭が不自然に伸縮する。まるで体内に宿った巨大で異質な何かを、消化管ごと外へ吐き出そうとしているかのような激しい身悶えだった。彼の喉の奥から、ゴボリ、ゴボリと、粘液が泡立つ不快な音が響いてくる。胃液と血が混ざり合った生臭い匂いが、一気に部屋中に立ち込めた。そのむせかえるような匂いは、ひどい眩暈を起こした。僕はソファの上で完全に硬直していた。腰の骨から力が抜け、指一本動かすことができない。膝が笑い、奥歯がガチガチと音を立てて噛み合わさる。ただただ、目の前で繰り広げられる悪夢のような惨劇を、見開かれた瞳で凝視することしかできなかった。",

function useHashRoute() {
  const [route, setRoute] = useState(() => window.location.hash.slice(1) || "/");
  useEffect(() => {
    const onChange = () => {
      setRoute(window.location.hash.slice(1) || "/");
      window.scrollTo({ top: 0, behavior: "auto" });
    };
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  }, []);
  return route;
}

function TitleAssemble({ text, charDelay = 70 }) {
  const [settled, setSettled] = useState(false);
  const chars = useMemo(() => Array.from(text || ""), [text]);
  // モバイルで「夭折した / 天使たちへ」と改行（該当タイトルのときのみ）
  const breakAfter = useMemo(() => {
    const t = text || "";
    if (t.indexOf("夭折した") === 0 && t.length > 4) return 3; // 0-based index of last char of 夭折した
    return -1;
  }, [text]);
  useEffect(() => {
    setSettled(false);
    const t = setTimeout(() => setSettled(true), 80);
    return () => clearTimeout(t);
  }, [text]);
  const nodes = [];
  chars.forEach((ch, i) => {
    const h = (i * 9301 + 233) % 233280;
    const n = h / 233280;
    const dx = (n - 0.5) * 40,
      dy = ((n * 7) % 1 - 0.5) * 28,
      dr = ((n * 13) % 1 - 0.5) * 8;
    nodes.push(
      React.createElement(
        "span",
        {
          key: "c" + i,
          className: "title-char" + (settled ? " is-settled" : ""),
          style: {
            "--dx": dx + "px",
            "--dy": dy + "px",
            "--dr": dr + "deg",
            transitionDelay: i * charDelay + "ms"
          },
          "aria-hidden": "true"
        },
        ch === " " ? " " : ch
      )
    );
    if (i === breakAfter) {
      nodes.push(
        React.createElement("br", {
          key: "br",
          className: "title-break-mobile",
          "aria-hidden": "true"
        })
      );
    }
  });
  return React.createElement("span", { "aria-label": text }, nodes);
}

            )

      );
    }
    return React.createElement("span", { className, style }, value);
  }
  const baseStyle = {
    font: "inherit",
    color: "inherit",
    letterSpacing: "inherit",
    lineHeight: "inherit",

  if (multiline) {

      rows: Math.max(4, (value || "").split("\n").length + 1)

  return React.createElement("input", {
    type: "text",
    value: value || "",
    onChange: (e) => onChange(e.target.value),
    style: baseStyle,
    className
  });
}

  const chapter = useMemo(
    () => chapters.find((c) => c.num === Number(num)),
    [chapters, num]
  );
  const [fontIndex, setFontIndex] = useState(() => {
    const s = Number(localStorage.getItem("novel:fontIndex"));
    return Number.isFinite(s) ? Math.min(SIZES.length - 1, Math.max(0, s)) : 1;
  });
  const [dark, setDark] = useState(() => localStorage.getItem("novel:dark") === "1");
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    localStorage.setItem("novel:fontIndex", String(fontIndex));
  }, [fontIndex]);
  useEffect(() => {
    localStorage.setItem("novel:dark", dark ? "1" : "0");
  }, [dark]);
  useEffect(() => {
    const r = document.documentElement;
    if (dark) r.classList.add("dark");
    else r.classList.remove("dark");
    return () => r.classList.remove("dark");
  }, [dark]);
  useEffect(() => {
    window.scrollTo({ top: 0, behavior: "auto" });
    setProgress(0);
  }, [num]);
  useEffect(() => {
    const onScroll = () => {
      const doc = document.documentElement;
      const max = doc.scrollHeight - doc.clientHeight;
      setProgress(max > 0 ? Math.min(1, Math.max(0, doc.scrollTop / max)) : 0);

                },
                React.createElement("span", { className: "sm-inline" }, "次話"),
                React.createElement(Icon, { w: 16, h: 16, d: ["m9 18 6-6-6-6"] })
              )
            : React.createElement("span", { style: { width: "3rem" } })
        ),
        next &&
          nextChapter &&
          React.createElement(
            "p",
            {
              style: {
                marginTop: "1.5rem",
                textAlign: "center",
                fontFamily: "var(--font-body)",
                fontSize: "0.75rem",
                color: "hsl(var(--muted-foreground) / 0.7)",
                letterSpacing: "0.05em"
              }
            },
            nextChapter.title
          ),
        !next &&
          React.createElement(
            "p",
            {
              style: {
                marginTop: "1.5rem",
                textAlign: "center",
                fontFamily: "var(--font-heading)",
                fontSize: "0.875rem",
                letterSpacing: "0.2em",
                color: "hsl(var(--muted-foreground) / 0.7)"
              }
            },
            "── 完 ──"
          )
      )
    )
  );
}

function App() {
  const route = useHashRoute();
  const [meta, setMeta] = useState(() => ({ ...defaultNovelMeta }));
  const [chapters, setChapters] = useState(() =>
    defaultChapters.map((c) => ({ ...c, paragraphs: [...c.paragraphs] }))
  );
  const [editing, setEditing] = useState(false);
  const [saving, setSaving] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [showLogin, setShowLogin] = useState(false);

  useEffect(() => {
    if (!auth) {
      setAuthReady(true);
      return;
    }
    const unsub = auth.onAuthStateChanged((u) => {
      setUser(u);
      setAuthReady(true);
      if (!u) setEditing(false);
    });
    return () => unsub();
  }, []);

  // まずローカルのデフォルトで画面を出し、Firestore は裏で同期する
  useEffect(() => {
    setLoaded(true);
  }, []);

  useEffect(() => {
    let cancelled = false;

    const applyData = (data) => {
      if (!data) return;
      // meta のみリモート同期。本文は常にローカルの defaultChapters（全文）を優先する
      if (data.meta) {
        setMeta({
          ...defaultNovelMeta,
          ...data.meta,
          characters: data.meta.characters || defaultNovelMeta.characters,
          timeline: data.meta.timeline || defaultNovelMeta.timeline
        });
      }
      // chapters のリモート上書きは無効化（提供された全文を保持）
    };

    (async () => {
      try {
        const data = await loadNovelViaRest();
        if (cancelled) return;
        if (data) {
          applyData(data);
          console.info("Firestore REST data loaded");
          return;
        }
        console.info("No Firestore doc via REST — using defaults");
      } catch (restErr) {
        console.warn("REST load failed, trying SDK:", restErr);
      }
      try {
        if (!db) return;
        const snap = await Promise.race([
          db.collection("novel").doc("main").get(),
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error("Firestore timeout")), 8000)
          )
        ]);
        if (cancelled) return;
        if (snap && snap.exists) {
          applyData(snap.data());
          console.info("Firestore SDK data loaded");
        }
      } catch (err) {
        console.warn("Firebase load failed, using defaults:", err);
        if (!cancelled) setLoadError(String(err && err.message ? err.message : err));
      }
    })();

    return () => {
      cancelled = true;
    };
  }, []);

  const markDirty = useCallback(() => setDirty(true), []);

  const updateMeta = useCallback((partial) => {
    setMeta((m) => ({ ...m, ...partial }));
    setDirty(true);
  }, []);

  const updateChapterTitle = useCallback((num, title) => {
    setChapters((chs) =>
      chs.map((c) => (c.num === num ? { ...c, title } : c))
    );
    setDirty(true);
  }, []);

  const updateChapterBody = useCallback((num, text) => {
    // 空行（2つ以上の改行）で段落分割。全文を一括編集できる
    const cleaned = String(text || "")
      .replace(/\r\n/g, "\n")
      .split(/\n\n+/)
      .map((s) => s.replace(/^\n+|\n+$/g, ""))
      .filter((s) => s.length > 0);
    setChapters((chs) =>
      chs.map((c) => (c.num === num ? { ...c, paragraphs: cleaned } : c))
    );
    setDirty(true);
  }, []);

  const saveToFirebase = useCallback(async () => {
    if (!auth || !auth.currentUser) {
      alert("保存するにはログインが必要です。EDIT からログインしてください。");
      setShowLogin(true);
      return;
    }
    setSaving(true);
    const payload = {
      meta: meta,
      chapters: chapters,
      updatedAt: new Date().toISOString()
    };
    try {
      const idToken = await auth.currentUser.getIdToken();
      try {
        await saveNovelViaRest(payload, idToken);
        setDirty(false);
        console.info("Saved via REST");
        return;
      } catch (restErr) {
        console.warn("REST save failed, trying SDK:", restErr);
      }
      if (!db) throw new Error("Firestore に接続できません");
      await db.collection("novel").doc("main").set({
        meta: meta,
        chapters: chapters,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      setDirty(false);
      console.info("Saved via SDK");
    } catch (err) {
      console.error("Save failed:", err);
      alert("保存に失敗しました: " + (err && err.message ? err.message : err));
    } finally {
      setSaving(false);
    }
  }, [meta, chapters]);

  const logout = useCallback(async () => {
    try {
      if (auth) await auth.signOut();
      setEditing(false);
      setShowLogin(false);
    } catch (err) {
      console.error("Logout failed:", err);
    }
  }, []);

  const ctx = {
    meta,
    chapters,
    editing,
    setEditing,
    saving,
    dirty,
    updateMeta,
    updateChapterTitle,
    updateChapterBody,
    saveToFirebase,
    user,
    showLogin,
    setShowLogin,
    logout
  };

  let page;
  if (!loaded) {
    page = React.createElement(
      "main",
      {
        style: {
          minHeight: "100vh",
          background: "var(--charcoal)",
          color: "var(--offwhite)",
          display: "flex",
          alignItems: "center",
          justifyContent: "center"
        }
      },
      React.createElement(
        "p",
        {
          className: "font-display",
          style: { letterSpacing: "0.3em", fontSize: "0.85rem", opacity: 0.6 }
        },
        "Loading…"
      )
    );
  } else if (route === "/" || route === "") {
    page = React.createElement(Home);
  } else if (route === "/contents") {
    page = React.createElement(Contents);
  } else if (route.startsWith("/read/")) {
    page = React.createElement(Read, { route });
  } else {
    page = React.createElement(
      "main",
      {
        style: {
          minHeight: "100vh",
          background: "var(--offwhite)",
          color: "var(--charcoal)",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          padding: "0 1.5rem"
        }
      },
      React.createElement(
        "div",
        { style: { textAlign: "center" } },
        React.createElement(
          "p",
          {
            className: "font-heading",
            style: { fontSize: "1.5rem", letterSpacing: "0.1em", marginBottom: "1.5rem" }
          },
          "ページが見つかりません"
        ),
        React.createElement(
          "a",
          {
            href: "#/",
            style: {
              fontFamily: "var(--font-body)",
              fontSize: "0.875rem",
              color: "var(--charcoal)",
              opacity: 0.6
            }
          },
          "表紙へ戻る"
        )
      )
    );
  }

  return React.createElement(
    NovelContext.Provider,
    { value: ctx },
    React.createElement(
      React.Fragment,
      null,
      page,
      React.createElement(PageFlash),
      loaded && React.createElement(EditToolbar)
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>

</body>
</html>
